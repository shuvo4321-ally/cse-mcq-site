ed to the nearest representable value."},{"t":"Computer arithmetic","d":2,"q":"A carry-lookahead adder is faster than a ripple-carry adder because it:","o":["Uses fewer gates","Computes carries in parallel from generate and propagate signals instead of waiting for them to ripple","Uses no carries","Runs on a faster clock"],"a":1,"e":"Gi = Ai·Bi, Pi = Ai ⊕ Bi; Ci+1 = Gi + Pi·Ci is expanded so carries are computed from the inputs directly."}]},{"id":"db","code":"CSE370","name":"Database Systems","qs":[{"t":"ER & relational model","d":1,"q":"In an ER diagram, a many-to-many (M:N) relationship between two entity sets is mapped to the relational model by:","o":["Adding a foreign key to either table","Creating a separate relation containing the keys of both entities (plus relationship attributes)","Merging the two entities","Ignoring it"],"a":1,"e":"A junction (associative) table holds foreign keys to both entities and together they form its primary key, e.g. Enroll(student_id, course_id, grade)."},{"t":"ER & relational model","d":2,"q":"A WEAK entity set is one that:","o":["Has no attributes","Has no primary key of its own and depends on an owner (identifying) entity via a total participation relationship","Cannot be related to others","Is always 1:1"],"a":1,"e":"Its key is the owner's key plus a partial key (discriminator), e.g. Dependent(name) of Employee."},{"t":"ER & relational model","d":2,"q":"Relation R(A, B, C) has candidate key A only. How many SUPERKEYS does R have?","o":["1","3","4","7"],"a":2,"e":"A superkey is any attribute set containing a key: {A}, {A,B}, {A,C}, {A,B,C} = 4 (2^(n−1) with n = 3)."},{"t":"ER & relational model","d":1,"q":"What is a FOREIGN KEY?","o":["A key that is unique in its own table","An attribute (set) that references the primary key of another relation to enforce referential integrity","A key stored in another database","An encrypted key"],"a":1,"e":"A foreign key value must either be NULL or match an existing key value in the referenced table."},{"t":"ER & relational model","d":2,"q":"Which statement about primary and candidate keys is TRUE?","o":["A table can have several primary keys","A table has exactly one primary key chosen from its candidate keys, which cannot contain NULL","A primary key may contain NULL","Candidate keys are always composite"],"a":1,"e":"Entity integrity: no primary-key attribute may be NULL. UNIQUE (alternate) keys may allow NULL depending on the DBMS."},{"t":"ER & relational model","d":2,"q":"Relation R has 10 tuples and S has 20 tuples. How many tuples are in R × S (Cartesian product)?","o":["30","200","10","20"],"a":1,"e":"|R × S| = |R| × |S| = 200."},{"t":"ER & relational model","d":2,"q":"Two relations are UNION-COMPATIBLE when:","o":["They have the same name","They have the same number of attributes with corresponding compatible domains","They have the same number of tuples","They share a key"],"a":1,"e":"Set operations (union, intersection, difference) require compatible schemas."},{"t":"ER & relational model","d":2,"q":"In relational algebra, σ (sigma) and π (pi) stand for:","o":["Join and union","Selection (rows) and projection (columns)","Projection and selection","Rename and division"],"a":1,"e":"σ_cgpa>3.5(Student) selects tuples; π_name(Student) keeps columns (and removes duplicates)."},{"t":"ER & relational model","d":2,"q":"The DIVISION operator in relational algebra is typically used for queries of the form:","o":["\"Find students who took AT LEAST ONE course\"","\"Find students who took ALL courses\"","\"Find the average grade\"","\"Find the maximum\""],"a":1,"e":"Division answers \"for all\" queries, such as students enrolled in every course offered."},{"t":"ER & relational model","d":2,"q":"Which of these is an example of a derived attribute in an ER diagram?","o":["Date of birth","Age computed from date of birth","Student ID","Phone number"],"a":1,"e":"A derived attribute (dashed oval) can be computed from other attributes and need not be stored."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat does `SELECT COUNT(*) FROM student;` return?","o":["5","6","3","1"],"a":1,"e":"COUNT(*) counts all rows including those with NULLs: 6."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat does `SELECT COUNT(cgpa) FROM student;` return?","o":["6","5","0","4"],"a":1,"e":"COUNT(column) ignores NULLs; Eli's cgpa is NULL, so 5."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat does `SELECT AVG(cgpa) FROM student WHERE dept = 'CSE';` return?","o":["2.43","3.65","3.5","3.77"],"a":1,"e":"AVG ignores NULLs: (3.8 + 3.5) / 2 = 3.65 (not divided by 3)."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhich rows does `SELECT name FROM student WHERE cgpa > 3.5;` return?","o":["Ana, Di, Fay","Ana, Cy, Di, Fay","Ana, Di, Fay, Eli","Ana, Di"],"a":0,"e":"Cgpa values above 3.5: Ana 3.8, Di 3.9, Fay 3.6. Cy is exactly 3.5 (not greater) and Eli's NULL makes the comparison UNKNOWN, so it is excluded."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhich query returns Eli?","o":["WHERE cgpa = NULL","WHERE cgpa IS NULL","WHERE cgpa == 0","WHERE cgpa LIKE NULL"],"a":1,"e":"Any comparison with NULL using = or <> is UNKNOWN. Use IS NULL / IS NOT NULL."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat is the result of: SELECT dept, COUNT(*) FROM student GROUP BY dept HAVING COUNT(*) >= 2 ORDER BY dept;","o":["CSE 3, EEE 2","BBA 1, CSE 3, EEE 2","CSE 2, EEE 2","CSE 3"],"a":0,"e":"Groups: BBA 1, CSE 3, EEE 2. HAVING filters groups, removing BBA."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhich students have NO enrolment? SELECT s.name FROM student s LEFT JOIN enroll e ON s.id = e.id WHERE e.id IS NULL ORDER BY s.name;","o":["Di, Eli, Fay","Ana, Bob, Cy","Di, Eli","Fay"],"a":0,"e":"The LEFT JOIN keeps all students; those with no match have NULL in e.id. Students 4, 5 and 6 have no enrolments."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nHow many rows does `SELECT * FROM student s JOIN enroll e ON s.id = e.id;` return?","o":["5","6","36","7"],"a":0,"e":"Only enrolments whose id exists in student match: (1,C1), (1,C2), (2,C1), (3,C3), (3,C1) = 5. The enrolment for id 7 has no matching student and is dropped by an inner join."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nHow many rows does `SELECT * FROM student s CROSS JOIN course c;` return?","o":["9","18","6","3"],"a":1,"e":"A cross join pairs every student with every course: 6 × 3 = 18."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat are the numbers of rows returned by `SELECT dept FROM student UNION SELECT dept FROM student` and by the same with UNION ALL?","o":["3 and 12","6 and 12","3 and 6","12 and 3"],"a":0,"e":"UNION removes duplicates (3 distinct departments); UNION ALL keeps all rows (6 + 6 = 12)."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat does `SELECT name FROM student WHERE cgpa = (SELECT MAX(cgpa) FROM student);` return?","o":["Ana","Di","Fay","Eli"],"a":1,"e":"The subquery returns 3.9, which belongs to Di."},{"t":"SQL","d":2,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat does `SELECT COUNT(DISTINCT dept) FROM student;` return?","o":["3","6","2","1"],"a":0,"e":"The distinct departments are CSE, EEE and BBA."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat does `SELECT cgpa FROM student ORDER BY cgpa DESC LIMIT 1 OFFSET 1;` return?","o":["3.9","3.8","3.6","NULL"],"a":1,"e":"Sorted descending: 3.9, 3.8, 3.6, 3.5, 3.2, NULL. Skipping 1 row gives the second highest, 3.8."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nHow many rows does `SELECT name FROM student WHERE id NOT IN (SELECT id FROM enroll);` return?","o":["0","3","5","6"],"a":1,"e":"Enrolled ids are 1, 2, 3 and 7. Students 4, 5 and 6 are not in the list: 3 rows. (If the subquery contained a NULL, NOT IN would return no rows at all.)"},{"t":"SQL","d":3,"q":"What does `SELECT 1 WHERE 5 NOT IN (1, 2, NULL);` return?","o":["1","An empty result","NULL","An error"],"a":1,"e":"5 NOT IN (1, 2, NULL) expands to 5<>1 AND 5<>2 AND 5<>NULL; the last term is UNKNOWN, so the whole condition is not TRUE and no row is returned."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat is the total number of credits for student 1 (`SELECT SUM(c.credit) FROM enroll e JOIN course c ON e.cid = c.cid WHERE e.id = 1;`)?","o":["3","6","7","10"],"a":1,"e":"Student 1 took C1 (3 credits) and C2 (3 credits): 6."},{"t":"SQL","d":3,"q":"Tables:\nstudent(id, name, dept, cgpa): (1, Ana, CSE, 3.8), (2, Bob, EEE, 3.2), (3, Cy, CSE, 3.5), (4, Di, BBA, 3.9), (5, Eli, CSE, NULL), (6, Fay, EEE, 3.6)\ncourse(cid, title, credit): (C1, DB, 3), (C2, OS, 3), (C3, AI, 4)\nenroll(id, cid, grade): (1, C1, A), (1, C2, B), (2, C1, B), (3, C3, A), (3, C1, A), (7, C2, C)\n\nWhat is the result of: SELECT id, COUNT(*) FROM enroll GROUP BY id ORDER BY id;","o":["1:2, 2:1, 3:2, 7:1","1:1, 2:1, 3:1, 7:1","1:2, 2:1, 3:2","2, 1, 2, 1"],"a":0,"e":"Enrolment counts per id: 1 → 2, 2 → 1, 3 → 2, 7 → 1."},{"t":"SQL","d":2,"q":"What is the difference between WHERE and HAVING?","o":["None","WHERE filters rows before grouping; HAVING filters groups after aggregation","HAVING filters rows before grouping","WHERE works only with aggregates"],"a":1,"e":"Aggregate functions cannot be used in WHERE because rows are filtered before the groups exist."},{"t":"SQL","d":2,"q":"What is the difference between DELETE, TRUNCATE and DROP?","o":["They are identical","DELETE removes selected rows (can be rolled back); TRUNCATE removes all rows quickly (DDL); DROP removes the table structure itself","DROP removes only rows","TRUNCATE removes the table definition"],"a":1,"e":"DELETE is DML and logged row by row; TRUNCATE is minimally logged and resets storage; DROP removes the table and its data."},{"t":"SQL","d":2,"q":"Which of these is a DDL (Data Definition Language) statement?","o":["SELECT","INSERT","CREATE TABLE","UPDATE"],"a":2,"e":"DDL: CREATE, ALTER, DROP, TRUNCATE. DML: SELECT, INSERT, UPDATE, DELETE. DCL: GRANT, REVOKE. TCL: COMMIT, ROLLBACK."},{"t":"SQL","d":2,"q":"Which SQL pattern matches names that start with \"A\" and have exactly 3 characters?","o":["LIKE 'A%'","LIKE 'A__'","LIKE '%A%'","LIKE 'A_'"],"a":1,"e":"`%` matches any sequence of characters; `_` matches exactly one. 'A__' = A plus two more characters."},{"t":"SQL","d":2,"q":"Which statement is TRUE about the NULL value in SQL?","o":["NULL equals 0","NULL = NULL is TRUE","NULL represents unknown or missing, and comparisons with it yield UNKNOWN","NULL is the empty string"],"a":2,"e":"SQL uses three-valued logic (TRUE, FALSE, UNKNOWN). Rows are returned only when the WHERE condition is TRUE."},{"t":"SQL","d":2,"q":"What does a VIEW represent?","o":["A physical copy of a table","A stored query that behaves like a virtual table","An index","A trigger"],"a":1,"e":"Views simplify queries and restrict access; a materialised view stores the result physically."},{"t":"SQL","d":2,"q":"What does a primary key constraint guarantee?","o":["Values are unique and NOT NULL","Values are sorted","Values reference another table","Values are encrypted"],"a":0,"e":"Unique and not null. FOREIGN KEY enforces referential integrity; CHECK restricts values."},{"t":"SQL","d":2,"q":"Which clause would you use to list each department with the highest cgpa in it?","o":["SELECT dept, MAX(cgpa) FROM student GROUP BY dept","SELECT dept, MAX(cgpa) FROM student ORDER BY dept","SELECT dept, cgpa FROM student HAVING MAX(cgpa)","SELECT MAX(dept, cgpa) FROM student"],"a":0,"e":"Use GROUP BY with an aggregate. Non-aggregated columns in SELECT must appear in GROUP BY."},{"t":"Normalisation","d":2,"q":"R(A, B, C, D, E) with FDs: A → B, B → C, CD → E. What is the closure of {A, D}?","o":["{A, D}","{A, B, C, D}","{A, B, C, D, E}","{A, D, E}"],"a":2,"e":"A → B gives B; B → C gives C; then C and D give E via CD → E. So {A, D}+ = {A, B, C, D, E}, meaning AD is a key."},{"t":"Normalisation","d":2,"q":"For the same relation R(A, B, C, D, E) with A → B, B → C, CD → E, what are the candidate keys?","o":["A","AD","AB","CD"],"a":1,"e":"Attributes A and D never appear on a right-hand side, so every key must contain both. AD already determines everything, so AD is the only candidate key."},{"t":"Normalisation","d":3,"q":"R(A, B, C) with FDs A → B and B → C (key A). What is the highest normal form?","o":["1NF","2NF but not 3NF","3NF but not BCNF","BCNF"],"a":1,"e":"A is the only key, so there is no partial dependency (2NF holds), but C depends on A through B (a transitive dependency non-key → non-key), violating 3NF."},{"t":"Normalisation","d":2,"q":"A relation is in 3NF if, for every non-trivial FD X → Y, either X is a superkey or:","o":["Y is a superkey","Y is a prime attribute (part of some candidate key)","X is a prime attribute","Y is a single attribute"],"a":1,"e":"BCNF drops the second option and requires X to be a superkey in every non-trivial FD."},{"t":"Normalisation","d":3,"q":"R(A, B, C) with FDs AB → C and C → B. Which statement is TRUE?","o":["R is in BCNF","R is in 3NF but not BCNF","R is not in 3NF","R is not in 2NF"],"a":1,"e":"Candidate keys: AB and AC. For C → B, C is not a superkey (violates BCNF), but B is a prime attribute (part of key AB), so 3NF holds."},{"t":"Normalisation","d":2,"q":"1NF requires that:","o":["No transitive dependencies exist","Attributes are atomic (no repeating groups or multivalued cells)","Every FD has a superkey on the left","There are no foreign keys"],"a":1,"e":"A table in first normal form has atomic values and a primary key."},{"t":"Normalisation","d":2,"q":"A partial dependency is:","o":["A non-key attribute depending on part of a composite candidate key","A key depending on a non-key","A dependency among non-key attributes","A multivalued dependency"],"a":0,"e":"Partial dependencies violate 2NF. Transitive dependencies violate 3NF."},{"t":"Normalisation","d":3,"q":"Which property must a decomposition have to avoid losing information when the pieces are re-joined?","o":["Lossless-join property","Smaller tables","Fewer attributes","More indexes"],"a":0,"e":"A decomposition into R1 and R2 is lossless if R1 ∩ R2 → R1 or R1 ∩ R2 → R2 holds."},{"t":"Normalisation","d":2,"q":"BCNF decomposition always guarantees:","o":["Dependency preservation and lossless join","Lossless join but not necessarily dependency preservation","Dependency preservation but not lossless join","Neither"],"a":1,"e":"3NF decomposition can guarantee both lossless join and dependency preservation; BCNF guarantees only lossless join."},{"t":"Normalisation","d":3,"q":"Armstrong's axiom of AUGMENTATION says:","o":["If X → Y then XZ → YZ","If X → Y and Y → Z then X → Z","If Y ⊆ X then X → Y","If X → YZ then X → Y"],"a":0,"e":"Reflexivity: Y ⊆ X ⇒ X → Y. Augmentation: X → Y ⇒ XZ → YZ. Transitivity: X → Y and Y → Z ⇒ X → Z."},{"t":"Normalisation","d":2,"q":"Denormalisation is sometimes done deliberately to:","o":["Remove all redundancy","Improve read performance by reducing joins at the cost of redundancy","Ensure BCNF","Delete duplicate keys"],"a":1,"e":"It trades update anomalies and storage for query speed in read-heavy systems (e.g. data warehouses)."},{"t":"Normalisation","d":2,"q":"The anomaly where deleting a row unintentionally removes other facts is called a:","o":["Insertion anomaly","Deletion anomaly","Update anomaly","Read anomaly"],"a":1,"e":"Normalisation removes insertion, update and deletion anomalies caused by redundancy."},{"t":"Transactions & concurrency","d":1,"q":"What does ACID stand for?","o":["Atomicity, Consistency, Isolation, Durability","Access, Control, Integrity, Data","Atomicity, Concurrency, Independence, Data","Availability, Consistency, Isolation, Distribution"],"a":0,"e":"Atomic (all or nothing), Consistent (valid state to valid state), Isolated (concurrent transactions do not interfere), Durable (committed data survives failures)."},{"t":"Transactions & concurrency","d":3,"q":"Schedule: r1(x) w2(x) w1(x). Is it conflict serializable?","o":["Yes, equivalent to T1 then T2","Yes, equivalent to T2 then T1","No: the precedence graph has a cycle T1 → T2 → T1","Cannot tell"],"a":2,"e":"r1(x) before w2(x) gives T1 → T2; w2(x) before w1(x) gives T2 → T1. A cycle in the precedence graph means the schedule is not conflict serializable."},{"t":"Transactions & concurrency","d":2,"q":"Which isolation level allows DIRTY READS?","o":["Read uncommitted","Read committed","Repeatable read","Serializable"],"a":0,"e":"Dirty read = reading uncommitted data of another transaction. Read committed prevents it but allows non-repeatable reads; repeatable read still allows phantoms; serializable prevents all three."},{"t":"Transactions & concurrency","d":2,"q":"A \"non-repeatable read\" is when:","o":["A transaction reads uncommitted data","A transaction reads the same row twice and gets different values because another transaction committed a change","New rows appear in a repeated range query","A lock is never released"],"a":1,"e":"A phantom read is when new rows appear (or disappear) in a repeated query."},{"t":"Transactions & concurrency","d":2,"q":"In two-phase locking (2PL), a transaction:","o":["Releases locks before acquiring any","Has a growing phase (acquire locks) followed by a shrinking phase (release locks), never acquiring after releasing","Uses only shared locks","Cannot deadlock"],"a":1,"e":"2PL guarantees conflict serializability, but deadlock is possible. Strict 2PL holds exclusive locks until commit, preventing cascading aborts."},{"t":"Transactions & concurrency","d":2,"q":"Write-ahead logging (WAL) requires that:","o":["Log records are written to stable storage before the corresponding data pages are written","Data pages are written first","The log is optional","Only commits are logged"],"a":0,"e":"The log enables undo (for uncommitted changes) and redo (for committed ones) after a crash."},{"t":"Indexing & storage","d":2,"q":"Why are B+ trees preferred over binary search trees for database indexes?","o":["They use less code","High fan-out gives a shallow tree, minimising disk I/Os; leaves are linked for range scans","They are always smaller","They use hashing"],"a":1,"e":"Each node matches a disk page, so a lookup on millions of rows needs only 3–4 page reads."},{"t":"Indexing & storage","d":2,"q":"A hash index is best for:","o":["Range queries","Equality lookups (WHERE key = value)","ORDER BY","Prefix searches"],"a":1,"e":"Hashing destroys order, so range queries cannot use it."},{"t":"Indexing & storage","d":2,"q":"A clustered index:","o":["Stores the data rows physically in key order (at most one per table)","Is always a hash index","Can be created many times per table","Is never used for the primary key"],"a":0,"e":"A non-clustered (secondary) index stores key values with pointers to rows. A table can have only one physical ordering."},{"t":"Indexing & storage","d":2,"q":"A B+ tree of order 4 (max 3 keys per node) has a root with 2 children, each internal. Roughly, increasing the number of indexed rows by 1000× increases the tree height by:","o":["1000×","About log_f(1000) levels (a few levels)","10 levels exactly","Nothing"],"a":1,"e":"Height grows logarithmically with fan-out f as the base, so even huge growth adds only a couple of levels."}]},{"id":"auto","code":"CSE331","name":"Automata & Computability","qs":[{"t":"Finite automata","d":1,"q":"A DFA is formally defined as a 5-tuple (Q, Σ, δ, q0, F). What does δ represent?","o":["The set of final states","The transition function Q × Σ → Q","The input alphabet","The start state"],"a":1,"e":"Q = states, Σ = alphabet, δ = transition function, q0 = start state, F = accepting states. For an NFA, δ maps to a SET of states (Q × Σ → 2^Q)."},{"t":"Finite automata","d":2,"q":"What is the minimum number of states in a DFA over {0, 1} accepting strings with an EVEN number of 0s?","o":["1","2","3","4"],"a":1,"e":"Two states are enough: \"even number of 0s so far\" (start/accepting) and \"odd\"."},{"t":"Finite automata","d":2,"q":"What is the minimum number of states in a DFA over {0, 1} accepting strings that END with 01?","o":["2","3","4","5"],"a":1,"e":"States remember the longest suffix that is a prefix of 01: ε, 0, 01. So 3 states."},{"t":"Finite automata","d":3,"q":"What is the minimum number of states in a DFA over {0, 1} accepting strings that CONTAIN the substring 101?","o":["3","4","5","8"],"a":1,"e":"States: nothing matched, matched 1, matched 10, matched 101 (accepting, absorbing). 4 states."},{"t":"Finite automata","d":2,"q":"How many binary strings of length 5 contain no two consecutive 1s?","o":["8","10","13","16"],"a":2,"e":"Counts follow the Fibonacci sequence: lengths 1..5 give 2, 3, 5, 8, 13."},{"t":"Finite automata","d":2,"q":"A DFA has states {q0, q1}, start q0, accepting {q0}. Transitions: q0 −0→ q1, q0 −1→ q0, q1 −0→ q0, q1 −1→ q1. Which of these strings does it accept?","o":["0","1001","010","1011"],"a":1,"e":"It accepts strings with an even number of 0s (q0 ends). 1001 has two 0s: accepted. The others have one 0 each."},{"t":"Finite automata","d":2,"q":"To obtain a DFA for the COMPLEMENT of a regular language from a complete DFA you:","o":["Reverse all transitions","Swap accepting and non-accepting states","Add ε-transitions","Remove the start state"],"a":1,"e":"This works only if the DFA is complete (every state has a transition on every symbol). It does NOT work directly for NFAs."},{"t":"Finite automata","d":2,"q":"DFAs for languages L1 (3 states) and L2 (4 states) are combined by the product construction for L1 ∩ L2. How many states does the product DFA have (before minimisation)?","o":["7","12","4","81"],"a":1,"e":"The product DFA's states are pairs (p, q): 3 × 4 = 12."},{"t":"Finite automata","d":2,"q":"Which statement about NFAs and DFAs is TRUE?","o":["NFAs recognise more languages","NFAs and DFAs recognise exactly the same class: regular languages","DFAs recognise more languages","NFAs cannot have ε-moves"],"a":1,"e":"Subset construction converts an NFA with n states to an equivalent DFA with at most 2ⁿ states."},{"t":"Finite automata","d":2,"q":"What is the minimum number of states of a DFA over {a} accepting strings whose length is divisible by 3?","o":["1","2","3","4"],"a":2,"e":"Track the length modulo 3 — three states."},{"t":"Finite automata","d":2,"q":"The ε-closure of a state in an ε-NFA is:","o":["The state alone","The set of states reachable from it using only ε-transitions (including itself)","The set of accepting states","The set of states reachable by any symbol"],"a":1,"e":"It is used when converting an ε-NFA to an NFA or DFA."},{"t":"Finite automata","d":3,"q":"Which language is NOT regular?","o":["{ w : w has an even number of a's }","{ aⁿbⁿ : n ≥ 0 }","{ w : w ends with ab }","{ aⁿ : n ≤ 100 }"],"a":1,"e":"aⁿbⁿ needs unbounded counting. Finite languages like n ≤ 100 are regular (finite memory suffices)."},{"t":"Regular expressions & properties","d":1,"q":"Which regular expression describes binary strings that end with 00?","o":["(0+1)*00","0*1*00","00(0+1)*","(00)*"],"a":0,"e":"Any string of 0s and 1s followed by 00."},{"t":"Regular expressions & properties","d":2,"q":"Which expression describes all strings over {a, b} containing at least one a?","o":["b*a(a+b)*","(a+b)*","a*b*","b*ab*"],"a":0,"e":"Skip leading b's, then the first a, then anything. b*ab* allows only one a."},{"t":"Regular expressions & properties","d":2,"q":"Simplify (a*)*.","o":["a*","a+","a","∅"],"a":0,"e":"Repeating a repeated zero-or-more still gives zero or more a's."},{"t":"Regular expressions & properties","d":2,"q":"ε + aa* is equivalent to:","o":["a+","a*","a","aa"],"a":1,"e":"aa* = a⁺ (one or more); adding ε gives zero or more: a*."},{"t":"Regular expressions & properties","d":3,"q":"How many strings of length exactly 4 are described by (ab + b)*?","o":["3","5","8","16"],"a":1,"e":"Concatenations of ab and b with total length 4: abab, abbb, babb, bbab, bbbb = 5."},{"t":"Regular expressions & properties","d":2,"q":"Regular languages are closed under:","o":["Union only","Union, intersection, complement, concatenation, Kleene star, reversal","Only intersection","None of the standard operations"],"a":1,"e":"All of these operations on regular languages give regular languages."},{"t":"Regular expressions & properties","d":3,"q":"The Pumping Lemma for regular languages is used to:","o":["Prove a language is regular","Prove that a language is NOT regular (by contradiction)","Build a DFA","Minimise a DFA"],"a":1,"e":"If every long string could be pumped within the first p symbols while staying in L, L might be regular; a language that violates this property is not regular. It cannot prove regularity."},{"t":"Regular expressions & properties","d":3,"q":"In the pumping lemma for regular languages, a string s with |s| ≥ p is split as s = xyz with which conditions?","o":["|xy| ≤ p, |y| > 0 and xyⁱz ∈ L for all i ≥ 0","|y| ≤ p and xyz ∈ L","|x| = |z|","|xyz| < p"],"a":0,"e":"Pumping y zero or more times keeps the string in L. For aⁿbⁿ, choosing s = aᵖbᵖ forces y to be all a's, and pumping breaks the count."},{"t":"Regular expressions & properties","d":2,"q":"The Myhill–Nerode theorem says that the number of states in the minimal DFA for L equals:","o":["The length of the longest string","The number of equivalence classes of the distinguishability relation of L","The number of symbols","The number of final states"],"a":1,"e":"Strings x, y are equivalent if appending any z gives the same acceptance for xz and yz. A language is regular iff the number of classes is finite."},{"t":"Regular expressions & properties","d":2,"q":"Which of these languages is regular?","o":["{ ww^R : w ∈ {a, b}* }","{ aᵖ : p is prime }","{ w : |w| is even }","{ aⁿ bᵐ cⁿ : n, m ≥ 0 }"],"a":2,"e":"Even length needs just two states. Palindromes of the form ww^R, primes and aⁿbᵐcⁿ all need unbounded memory."},{"t":"Context-free languages","d":2,"q":"Which grammar generates { aⁿbⁿ : n ≥ 0 }?","o":["S → aSb | ε","S → aS | bS | ε","S → ab | ba","S → SS | a"],"a":0,"e":"Each use of S → aSb adds one a on the left and one b on the right."},{"t":"Context-free languages","d":2,"q":"A grammar is in Chomsky Normal Form (CNF) if every production has the form:","o":["A → BC or A → a (plus possibly S → ε)","A → aB only","A → α with |α| ≥ 3","Any production"],"a":0,"e":"CNF grammars simplify proofs and algorithms such as CYK."},{"t":"Context-free languages","d":2,"q":"A string of length n = 5 is derived using a CNF grammar. How many derivation steps (production applications) are needed?","o":["5","9","10","25"],"a":1,"e":"n − 1 steps use A → BC, and n steps use A → a: (n − 1) + n = 2n − 1 = 9."},{"t":"Context-free languages","d":2,"q":"The CYK algorithm decides membership for a CNF grammar in time:","o":["O(n)","O(n log n)","O(n³ · |G|)","O(2ⁿ)"],"a":2,"e":"It fills an n × n table by dynamic programming."},{"t":"Context-free languages","d":2,"q":"Which machine recognises exactly the context-free languages?","o":["Finite automaton","Nondeterministic pushdown automaton","Linear bounded automaton","Turing machine"],"a":1,"e":"A PDA is a finite automaton plus a stack. Deterministic PDAs are strictly weaker than nondeterministic ones (e.g. even-length palindromes need nondeterminism)."},{"t":"Context-free languages","d":3,"q":"Which language is NOT context-free?","o":["{ aⁿbⁿ : n ≥ 0 }","{ ww^R : w ∈ {a,b}* }","{ aⁿbⁿcⁿ : n ≥ 0 }","{ aⁿbᵐ : n ≠ m }"],"a":2,"e":"Matching three counts needs more than one stack (proved with the pumping lemma for CFLs). The other languages are context-free."},{"t":"Context-free languages","d":2,"q":"Context-free languages are closed under:","o":["Union, concatenation and Kleene star","Intersection and complement","All Boolean operations","None"],"a":0,"e":"They are NOT closed under intersection or complement (though the intersection with a regular language is context-free)."},{"t":"Context-free languages","d":2,"q":"A pushdown automaton can accept by:","o":["Final state only","Empty stack only","Final state or empty stack (the two modes are equivalent in power)","Neither"],"a":2,"e":"Both acceptance modes recognise the same class of languages (CFLs), though the constructions differ."},{"t":"Turing machines & decidability","d":1,"q":"Match the Chomsky hierarchy: Type 3, Type 2, Type 1, Type 0.","o":["Regular, context-free, context-sensitive, recursively enumerable","Context-free, regular, recursively enumerable, context-sensitive","Recursively enumerable, context-sensitive, context-free, regular","Regular, context-sensitive, context-free, recursively enumerable"],"a":0,"e":"Automata: finite automaton, pushdown automaton, linear bounded automaton, Turing machine."},{"t":"Turing machines & decidability","d":2,"q":"A language is DECIDABLE if:","o":["Some Turing machine accepts every string in it","Some Turing machine halts on every input, accepting exactly the strings in the language","It is finite","It is regular only"],"a":1,"e":"Recognisable (recursively enumerable) means the TM may loop on strings not in the language; decidable (recursive) requires halting on all inputs."},{"t":"Turing machines & decidability","d":2,"q":"The Halting Problem is:","o":["Decidable","Recognisable but undecidable","Not even recognisable","In P"],"a":1,"e":"A universal TM can simulate and accept halting programs, but no TM can decide for all inputs (Turing's diagonal argument)."},{"t":"Turing machines & decidability","d":3,"q":"Rice's theorem states that:","o":["All problems about programs are decidable","Every non-trivial semantic property of the language recognised by a Turing machine is undecidable","Halting is decidable","Regular languages are undecidable"],"a":1,"e":"Examples: \"Does this program ever print 0?\" or \"Is L(M) empty?\" (for TMs) are undecidable."},{"t":"Turing machines & decidability","d":2,"q":"Which problem about regular languages/DFAs is DECIDABLE?","o":["Whether two DFAs accept the same language","Nothing","Whether a TM halts","Whether two CFGs are equivalent"],"a":0,"e":"DFA equivalence can be decided by minimising or checking the symmetric difference for emptiness. Equivalence of two CFGs is undecidable."},{"t":"Turing machines & decidability","d":2,"q":"The Church–Turing thesis claims that:","o":["Every problem is solvable","Anything that is intuitively computable can be computed by a Turing machine","P = NP","Quantum computers are impossible"],"a":1,"e":"It is a thesis (not a theorem) linking informal computability to the formal model."},{"t":"Turing machines & decidability","d":2,"q":"Multi-tape Turing machines compared with single-tape machines:","o":["Recognise more languages","Recognise exactly the same languages (with at most a quadratic slowdown)","Recognise fewer languages","Cannot halt"],"a":1,"e":"Nondeterministic TMs also recognise the same languages, with a possibly exponential slowdown in simulation."},{"t":"Turing machines & decidability","d":2,"q":"Which is decidable?","o":["Emptiness of a context-free grammar (does it generate any string?)","Whether a context-free grammar is ambiguous","Whether two CFGs generate the same language","Whether a TM accepts nothing"],"a":0,"e":"Emptiness for CFGs can be decided by marking productive non-terminals. Ambiguity and equivalence of CFGs are undecidable."}]},{"id":"math","code":"MATHS","name":"Maths: factorial, probability, vectors, matrices","qs":[{"t":"Factorials & combinatorics","d":1,"q":"What is the value of 5! ?","o":["120","25","60","24"],"a":0,"e":"5! = 5 × 4 × 3 × 2 × 1 = 120."},{"t":"Factorials & combinatorics","d":1,"q":"What is 0! equal to?","o":["0","Undefined","10","1"],"a":3,"e":"By definition 0! = 1. It makes formulas like C(n, 0) = n!/(0! n!) = 1 work: there is exactly one way to choose nothing."},{"t":"Factorials & combinatorics","d":1,"q":"Evaluate 7! / 5!","o":["2","35","14","42"],"a":3,"e":"7!/5! = 7 × 6 = 42. Cancel the common 5! instead of computing both."},{"t":"Factorials & combinatorics","d":1,"q":"Evaluate 10! / (8! × 2!)","o":["90","20","5","45"],"a":3,"e":"10!/(8! 2!) = (10 × 9)/2 = 45. This is C(10, 2)."},{"t":"Factorials & combinatorics","d":1,"q":"What is the value of C(8, 3)?","o":["56","24","336","112"],"a":0,"e":"C(8,3) = 8!/(3! 5!) = (8 × 7 × 6)/(3 × 2 × 1) = 56."},{"t":"Factorials & combinatorics","d":1,"q":"What is the value of P(7, 2)?","o":["42","21","14","49"],"a":0,"e":"P(7,2) = 7 × 6 = 42. Order matters, so there are twice as many as C(7,2) = 21."},{"t":"Factorials & combinatorics","d":1,"q":"How many different ways can 5 people stand in a line?","o":["120","25","60","24"],"a":0,"e":"5! = 120 (5 choices for the first place, 4 for the next, ...)."},{"t":"Factorials & combinatorics","d":2,"q":"How many distinct arrangements are there of the letters of the word APPLE?","o":["120","60","30","24"],"a":1,"e":"5 letters with P repeated twice: 5!/2! = 60. Dividing by 2! removes the double count of swapping the two P's."},{"t":"Factorials & combinatorics","d":2,"q":"How many distinct arrangements of the letters of BANANA are there?","o":["720","60","120","360"],"a":1,"e":"6 letters: A three times, N twice, B once: 6!/(3! 2!) = 60."},{"t":"Factorials & combinatorics","d":3,"q":"How many distinct arrangements of the letters of MISSISSIPPI are there?","o":["39916800","990","34650","17325"],"a":2,"e":"11 letters with I ×4, S ×4, P ×2 and M ×1: 11!/(4! 4! 2!) = 34650."},{"t":"Factorials & combinatorics","d":2,"q":"In how many ways can 6 people sit around a circular table (rotations count as the same)?","o":["720","60","24","120"],"a":3,"e":"Fix one person to remove rotations; arrange the other 5: (6 − 1)! = 120."},{"t":"Factorials & combinatorics","d":2,"q":"A committee of 3 is chosen from 5 men and 4 women. How many committees contain at least one woman?","o":["84","74","112","10"],"a":1,"e":"Total C(9,3) = 84 minus all-men C(5,3) = 10 gives 74. 'At least one' is easiest by complement. (Option C(4,1)×C(8,2) overcounts committees with several women.)"},{"t":"Factorials & combinatorics","d":1,"q":"At a party of 10 people everyone shakes hands once with everybody else. How many handshakes are there?","o":["100","45","90","20"],"a":1,"e":"Each handshake is a pair: C(10,2) = (10 × 9)/2 = 45."},{"t":"Factorials & combinatorics","d":2,"q":"How many diagonals does a regular octagon have?","o":["28","16","20","40"],"a":2,"e":"Any two vertices give a line: C(8,2) = 28. Subtract the 8 sides: 20. In general n(n − 3)/2."},{"t":"Factorials & combinatorics","d":1,"q":"How many 3-digit numbers can be formed from the digits 1, 2, 3, 4, 5 if no digit is repeated?","o":["60","125","10","15"],"a":0,"e":"P(5,3) = 5 × 4 × 3 = 60."},{"t":"Factorials & combinatorics","d":1,"q":"How many 3-digit numbers can be formed from the digits 1, 2, 3, 4, 5 if repetition IS allowed?","o":["60","125","15","243"],"a":1,"e":"Each of the 3 positions has 5 choices: 5³ = 125."},{"t":"Factorials & combinatorics","d":2,"q":"How many 3-digit EVEN numbers can be formed from 1, 2, 3, 4, 5 without repetition?","o":["30","24","36","60"],"a":1,"e":"The last digit must be 2 or 4 (2 choices). The other two places are filled from the remaining 4 digits in P(4,2) = 12 ways: 2 × 12 = 24."},{"t":"Factorials & combinatorics","d":2,"q":"5 people sit in a row. In how many ways can they sit if two particular people A and B must be together?","o":["120","72","48","24"],"a":2,"e":"Glue A and B into one block (2 internal orders). Now 4 units: 4! × 2 = 48."},{"t":"Factorials & combinatorics","d":2,"q":"5 people sit in a row. In how many ways can they sit if two particular people A and B must NOT sit together?","o":["48","24","96","72"],"a":3,"e":"Total 5! = 120 minus the 'together' arrangements 48 = 72."},{"t":"Factorials & combinatorics","d":2,"q":"What is C(5,2) + C(5,3)?","o":["30","10","15","20"],"a":3,"e":"C(5,2) = 10 and C(5,3) = 10, total 20 = C(6,3). This is Pascal's rule: C(n,r) + C(n,r+1) = C(n+1,r+1)."},{"t":"Factorials & combinatorics","d":1,"q":"What is the sum C(6,0) + C(6,1) + ... + C(6,6)?","o":["36","720","64","32"],"a":2,"e":"The row sum of Pascal's triangle is 2ⁿ: 2⁶ = 64. It also counts all subsets of a 6-element set."},{"t":"Factorials & combinatorics","d":1,"q":"How many subsets does a set with 5 elements have?","o":["32","25","10","120"],"a":0,"e":"Each element is in or out: 2⁵ = 32 (including the empty set and the set itself)."},{"t":"Factorials & combinatorics","d":2,"q":"How many trailing zeros does 10! end with?","o":["1","2","3","10"],"a":1,"e":"A trailing zero comes from a factor 10 = 2 × 5. 10! contains 5 and 10, giving two factors of 5 (and plenty of 2s), so 2 zeros: 10! = 3,628,800."},{"t":"Factorials & combinatorics","d":3,"q":"How many trailing zeros does 25! end with?","o":["5","6","25","7"],"a":1,"e":"Count the factors of 5: ⌊25/5⌋ + ⌊25/25⌋ = 5 + 1 = 6."},{"t":"Factorials & combinatorics","d":2,"q":"3 boys and 3 girls sit in a row so that boys and girls alternate. How many arrangements are there?","o":["36","72","720","144"],"a":1,"e":"Two patterns (BGBGBG or GBGBGB), 3! ways for the boys and 3! for the girls: 2 × 6 × 6 = 72."},{"t":"Factorials & combinatorics","d":3,"q":"How many ways can 5 identical balls be put into 3 different boxes (empty boxes allowed)?","o":["15","35","243","21"],"a":3,"e":"Stars and bars: C(n + k − 1, k − 1) = C(5 + 3 − 1, 2) = C(7,2) = 21."},{"t":"Factorials & combinatorics","d":3,"q":"How many positive integer solutions does x + y + z = 10 have?","o":["36","66","120","27"],"a":0,"e":"Every variable ≥ 1, so choose 2 dividers among 9 gaps: C(9,2) = 36."},{"t":"Factorials & combinatorics","d":3,"q":"How many derangements (no object in its original place) of 4 objects are there?","o":["8","12","9","24"],"a":2,"e":"D4 = 4!(1 − 1/1! + 1/2! − 1/3! + 1/4!) = 24 − 24 + 12 − 4 + 1 = 9."},{"t":"Factorials & combinatorics","d":1,"q":"In how many ways can 4 people be seated in 6 chairs in a row?","o":["360","15","24","720"],"a":0,"e":"P(6,4) = 6 × 5 × 4 × 3 = 360."},{"t":"Factorials & combinatorics","d":2,"q":"How many 4-letter codes can be made from the 26 letters if no letter repeats?","o":["358800","456976","14950","104"],"a":0,"e":"26 × 25 × 24 × 23 = 358800. (Repetition would give 26⁴ = 456976.)"},{"t":"Factorials & combinatorics","d":1,"q":"How many 4-digit PINs are possible if digits may repeat (0–9)?","o":["5040","10000","9000","40"],"a":1,"e":"10 choices for each of 4 places: 10⁴ = 10000."},{"t":"Factorials & combinatorics","d":2,"q":"A robot moves only right or up from (0,0) to (3,2). How many different paths are there?","o":["6","5","10","20"],"a":2,"e":"Every path has 3 R's and 2 U's in some order: 5!/(3! 2!) = C(5,2) = 10."},{"t":"Factorials & combinatorics","d":1,"q":"Which statement is TRUE?","o":["P(n, r) = C(n, r)","n! = n × (n + 1)!","C(n, r) = P(n, r) × r!","C(n, r) = C(n, n − r)"],"a":3,"e":"Choosing r items to take is the same as choosing n − r to leave. P(n,r) = C(n,r) × r! (not the other way round)."},{"t":"Factorials & combinatorics","d":1,"q":"When should you use a PERMUTATION rather than a combination?","o":["When the order does not matter","When items are identical","When there are fewer than 3 items","When the order of selection matters"],"a":3,"e":"Permutations count ordered arrangements (a race result, a PIN); combinations count unordered selections (a committee, a hand of cards)."},{"t":"Factorials & combinatorics","d":1,"q":"Simplify n! / (n − 2)!","o":["n²","n(n − 1)","n − 2","n(n − 2)"],"a":1,"e":"n! = n(n − 1)(n − 2)!, so the (n − 2)! cancels, leaving n(n − 1)."},{"t":"Factorials & combinatorics","d":2,"q":"If C(n, 2) = 21, what is n?","o":["6","8","7","21"],"a":2,"e":"n(n − 1)/2 = 21 → n(n − 1) = 42 = 7 × 6, so n = 7."},{"t":"Factorials & combinatorics","d":2,"q":"If P(n, 2) = 56, what is n?","o":["7","9","8","28"],"a":2,"e":"n(n − 1) = 56 = 8 × 7, so n = 8."},{"t":"Factorials & combinatorics","d":2,"q":"A team of 5 is chosen from 11 players and one of the chosen five is made captain. How many ways?","o":["462","55440","4620","2310"],"a":3,"e":"Choose the team C(11,5) = 462, then the captain in 5 ways: 2310. Equivalent: 11 × C(10,4) = 2310 (captain first)."},{"t":"Factorials & combinatorics","d":1,"q":"How many ways can a president and a vice-president be chosen from 8 members?","o":["28","16","64","56"],"a":3,"e":"The two posts are different, so order matters: P(8,2) = 8 × 7 = 56."},{"t":"Factorials & combinatorics","d":1,"q":"How many ways can a 2-person team be chosen from 8 members?","o":["56","16","28","64"],"a":2,"e":"Team members have no roles, so order does not matter: C(8,2) = 28."},{"t":"Factorials & combinatorics","d":2,"q":"How many 5-card poker hands can be dealt from a 52-card deck?","o":["2598960","311875200","3168366","260"],"a":0,"e":"C(52,5) = 2,598,960."},{"t":"Factorials & combinatorics","d":2,"q":"From 6 different books, in how many ways can you choose 2 to take on a trip and arrange them on a shelf?","o":["15","36","12","30"],"a":3,"e":"Choose and order 2 of 6: P(6,2) = 30. (C(6,2) = 15 would ignore the order on the shelf.)"},{"t":"Factorials & combinatorics","d":2,"q":"How many ways can the letters of the word LEVEL be arranged?","o":["120","60","16","30"],"a":3,"e":"5 letters with L twice and E twice: 5!/(2! 2!) = 30."},{"t":"Factorials & combinatorics","d":2,"q":"There are 4 roads from town A to town B and 3 roads from B to C. How many different routes A → B → C are there?","o":["7","24","12","8"],"a":2,"e":"Multiplication principle: independent stages multiply, 4 × 3 = 12. (Adding, 4 + 3, is for alternative single steps.)"},{"t":"Factorials & combinatorics","d":2,"q":"You have 4 shirts, 3 trousers and 2 pairs of shoes. How many different outfits (one of each) can you make?","o":["9","24","12","8"],"a":1,"e":"4 × 3 × 2 = 24 by the multiplication principle."},{"t":"Factorials & combinatorics","d":3,"q":"How many 4-digit numbers (1000–9999) have all digits different?","o":["5040","9000","4536","6561"],"a":2,"e":"First digit: 9 choices (not 0); second: 9 (any digit but the first, now 0 is allowed); third: 8; fourth: 7. Total 4536."},{"t":"Factorials & combinatorics","d":2,"q":"How many 4-digit numbers (1000–9999) are there altogether?","o":["10000","9000","8999","9999"],"a":1,"e":"From 1000 to 9999 inclusive: 9999 − 1000 + 1 = 9000."},{"t":"Factorials & combinatorics","d":2,"q":"What is the coefficient of x² in the expansion of (1 + x)⁵?","o":["5","20","10","25"],"a":2,"e":"The coefficient of xʳ in (1 + x)ⁿ is C(n, r): C(5,2) = 10."},{"t":"Factorials & combinatorics","d":2,"q":"How many terms does the expansion of (a + b)⁷ have?","o":["7","6","8","14"],"a":2,"e":"The powers of a run from 7 down to 0: n + 1 = 8 terms."},{"t":"Factorials & combinatorics","d":3,"q":"How many ways can 8 identical coins be given to 3 children if each child must get at least one coin?","o":["45","56","22","21"],"a":3,"e":"Give 1 coin to each first; 5 remain to distribute freely: C(5 + 2, 2) = C(7,2) = 21."},{"t":"Factorials & combinatorics","d":1,"q":"What is 4! + 3! ?","o":["30","5040","7","48"],"a":0,"e":"4! = 24 and 3! = 6, so the sum is 30. Factorials do not add: 4! + 3! ≠ 7!."},{"t":"Probability","d":1,"q":"A fair coin is tossed once. What is the probability of heads?","o":["1/2","1","1/4","2"],"a":0,"e":"Two equally likely outcomes, one favourable: 1/2."},{"t":"Probability","d":1,"q":"A fair die is rolled. What is the probability of an even number?","o":["1/3","2/3","1/6","1/2"],"a":3,"e":"Even outcomes: 2, 4, 6 → 3 of 6 = 1/2."},{"t":"Probability","d":1,"q":"A fair die is rolled. What is the probability of getting a number greater than 4?","o":["1/3","1/6","1/2","2/3"],"a":0,"e":"Favourable outcomes: 5 and 6 → 2/6 = 1/3."},{"t":"Probability","d":1,"q":"Two fair dice are rolled. What is the probability that the sum is 7?","o":["1/12","7/36","1/36","1/6"],"a":3,"e":"Pairs with sum 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6 of 36 = 1/6. Seven is the most likely sum."},{"t":"Probability","d":1,"q":"Two fair dice are rolled. What is the probability that the sum is 12?","o":["1/36","1/12","1/6","1/18"],"a":0,"e":"Only (6,6): 1/36."},{"t":"Probability","d":2,"q":"Two fair dice are rolled. What is the probability that the sum is at least 10?","o":["1/12","1/6","1/9","1/4"],"a":1,"e":"Sums 10, 11, 12 occur in 3 + 2 + 1 = 6 ways: 6/36 = 1/6."},{"t":"Probability","d":1,"q":"Two fair dice are rolled. What is the probability that the sum is even?","o":["1/3","2/3","1/2","5/12"],"a":2,"e":"Even sum means both dice are even or both odd: 9 + 9 = 18 of 36 = 1/2."},{"t":"Probability","d":2,"q":"Two fair dice are rolled. What is the probability that at least one die shows a 6?","o":["1/3","11/36","1/6","1/36"],"a":1,"e":"Complement: no 6 on either die is (5/6)² = 25/36, so at least one 6 has probability 1 − 25/36 = 11/36."},{"t":"Probability","d":2,"q":"Two fair dice are rolled. What is the probability that the product is odd?","o":["1/2","1/4","3/4","1/3"],"a":1,"e":"Odd × odd only: 3 × 3 = 9 of 36 = 1/4."},{"t":"Probability","d":2,"q":"Two fair dice are rolled. What is the probability that the sum is a prime number?","o":["5/12","1/3","7/18","1/2"],"a":0,"e":"Prime sums 2, 3, 5, 7, 11 occur in 1 + 2 + 4 + 6 + 2 = 15 ways: 15/36 = 5/12."},{"t":"Probability","d":2,"q":"Two fair dice are rolled. What is the probability that exactly one die shows a 6?","o":["5/18","1/6","11/36","1/3"],"a":0,"e":"(6, non-6) or (non-6, 6): 2 × 5 = 10 of 36 = 5/18. (Option 11/36 also includes the double six.)"},{"t":"Probability","d":1,"q":"A fair coin is tossed 3 times. What is the probability of exactly two heads?","o":["1/4","1/2","2/3","3/8"],"a":3,"e":"Outcomes HHT, HTH, THH = 3 of 8 equally likely outcomes: 3/8."},{"t":"Probability","d":1,"q":"A fair coin is tossed 3 times. What is the probability of at least one head?","o":["3/4","1/2","1/8","7/8"],"a":3,"e":"Complement of 'all tails' (1/8): 1 − 1/8 = 7/8."},{"t":"Probability","d":1,"q":"A fair coin is tossed 3 times. What is the probability that all three results are the same?","o":["1/8","1/2","1/4","3/8"],"a":2,"e":"HHH or TTT = 2 of 8 = 1/4."},{"t":"Probability","d":2,"q":"A fair coin is tossed 4 times. What is the probability of exactly 2 heads?","o":["1/4","3/8","1/2","1/3"],"a":1,"e":"C(4,2) = 6 favourable out of 2⁴ = 16: 6/16 = 3/8."},{"t":"Probability","d":2,"q":"A fair coin is tossed 3 times. What is the probability of at least 2 heads?","o":["3/8","3/4","1/2","1/8"],"a":2,"e":"Outcomes with 2 or 3 heads: 3 + 1 = 4 of 8 = 1/2."},{"t":"Probability","d":1,"q":"One card is drawn from a standard 52-card deck. What is the probability that it is an ace?","o":["1/52","1/13","1/4","1/26"],"a":1,"e":"4 aces in 52 cards = 4/52 = 1/13."},{"t":"Probability","d":1,"q":"One card is drawn from a standard deck. What is the probability that it is a face card (J, Q, K)?","o":["3/13","1/13","4/13 ","1/4"],"a":0,"e":"3 face ranks × 4 suits = 12 cards: 12/52 = 3/13."},{"t":"Probability","d":2,"q":"One card is drawn from a standard deck. What is the probability that it is a king OR a heart?","o":["4/13","17/52","5/13 ","1/52"],"a":0,"e":"P(K) + P(H) − P(K and H) = 4/52 + 13/52 − 1/52 = 16/52 = 4/13. Subtract the king of hearts because it was counted twice."},{"t":"Probability","d":2,"q":"One card is drawn from a standard deck. What is the probability that it is NOT a spade?","o":["1/4","1/13","3/4","1/2"],"a":2,"e":"13 spades, so 39 non-spades: 39/52 = 3/4."},{"t":"Probability","d":2,"q":"Two cards are drawn WITHOUT replacement from a standard deck. What is the probability that both are aces?","o":["1/221","1/169","1/52","4/663 "],"a":0,"e":"(4/52) × (3/51) = 12/2652 = 1/221. Without replacement the second probability changes."},{"t":"Probability","d":2,"q":"Two cards are drawn without replacement. What is the probability that both are hearts?","o":["1/16","1/17","1/13","3/52"],"a":1,"e":"(13/52) × (12/51) = 1/4 × 4/17 = 1/17."},{"t":"Probability","d":2,"q":"Two cards are drawn without replacement. What is the probability that the first is an ace and the second is a king?","o":["1/169","16/2704","4/663","2/221"],"a":2,"e":"(4/52) × (4/51) = 16/2652 = 4/663."},{"t":"Probability","d":3,"q":"Two cards are drawn without replacement. What is the probability that they have the same colour?","o":["1/2","26/51","1/4","25/51"],"a":3,"e":"First card any; the second must match its colour: 25 of the remaining 51 cards. P = 25/51."},{"t":"Probability","d":2,"q":"A bag has 5 red and 3 blue balls. One ball is drawn at random. What is P(red)?","o":["3/8","5/8","5/3","1/2"],"a":1,"e":"5 favourable among 8: 5/8."},{"t":"Probability","d":2,"q":"A bag has 5 red and 3 blue balls. Two balls are drawn WITHOUT replacement. What is P(both red)?","o":["25/64","5/8","5/14","1/4"],"a":2,"e":"(5/8) × (4/7) = 20/56 = 5/14. Equivalent: C(5,2)/C(8,2) = 10/28 = 5/14."},{"t":"Probability","d":2,"q":"A bag has 5 red and 3 blue balls. Two balls are drawn WITH replacement. What is P(both red)?","o":["5/14","5/16","15/56","25/64"],"a":3,"e":"Independent draws: (5/8)² = 25/64."},{"t":"Probability","d":3,"q":"A bag has 5 red and 3 blue balls. Two balls are drawn without replacement. What is P(one red and one blue, in any order)?","o":["15/28","15/64","5/14","3/7"],"a":0,"e":"RB: (5/8)(3/7) = 15/56; BR: (3/8)(5/7) = 15/56. Total 30/56 = 15/28. Equivalent: 5 × 3 / C(8,2) = 15/28."},{"t":"Probability","d":1,"q":"P(A) = 0.4, P(B) = 0.5 and A and B are independent. What is P(A and B)?","o":["0.9","0.1","0.2","0.45"],"a":2,"e":"For independent events P(A ∩ B) = P(A) × P(B) = 0.4 × 0.5 = 0.2."},{"t":"Probability","d":1,"q":"P(A) = 0.4, P(B) = 0.5, independent. What is P(A or B)?","o":["0.9","0.2","0.7","0.45"],"a":2,"e":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 0.4 + 0.5 − 0.2 = 0.7."},{"t":"Probability","d":1,"q":"The probability of rain tomorrow is 0.3. What is the probability that it does NOT rain?","o":["0.3","0.03","0.7","1.3"],"a":2,"e":"Complement rule: 1 − 0.3 = 0.7."},{"t":"Probability","d":1,"q":"A and B are mutually exclusive with P(A) = 0.3 and P(B) = 0.5. What is P(A or B)?","o":["0.8","0.15","0.2","0.65"],"a":0,"e":"Mutually exclusive events cannot happen together, so probabilities simply add: 0.3 + 0.5 = 0.8."},{"t":"Probability","d":2,"q":"P(A and B) = 0.2 and P(B) = 0.5. What is P(A | B)?","o":["0.1","0.4","0.7","0.25"],"a":1,"e":"P(A | B) = P(A ∩ B)/P(B) = 0.2/0.5 = 0.4."},{"t":"Probability","d":2,"q":"A fair die is rolled and the result is known to be even. What is the probability that it is greater than 3?","o":["1/2","1/3","2/3","1/6"],"a":2,"e":"Given even: {2, 4, 6}. Greater than 3: {4, 6}. So 2/3."},{"t":"Probability","d":2,"q":"Two dice are rolled. Given that the first die shows 3, what is the probability that the sum is 8?","o":["1/6","1/36","5/36","1/3"],"a":0,"e":"The second die must be 5: probability 1/6."},{"t":"Probability","d":3,"q":"A family has two children. Given that at least one is a girl, what is the probability that both are girls?","o":["1/2","1/3","1/4","2/3"],"a":1,"e":"Equally likely: GG, GB, BG, BB. At least one girl: GG, GB, BG → 3 outcomes, one of which is GG: 1/3."},{"t":"Probability","d":3,"q":"Two dice are rolled and at least one shows a 4. What is the probability that the sum is 7?","o":["1/6","2/11","2/36","1/11"],"a":1,"e":"Pairs with at least one 4: 11. Of those, sum 7: (3,4) and (4,3) → 2/11."},{"t":"Probability","d":3,"q":"A disease affects 1% of a population. A test detects it 99% of the time when present and gives a false positive 5% of the time when absent. A person tests positive. What is the probability they have the disease?","o":["99/100","1/100","1/6","5/6"],"a":2,"e":"Bayes: P(D | +) = (0.99 × 0.01) / (0.99 × 0.01 + 0.05 × 0.99) = 0.0099 / 0.0594 = 1/6 ≈ 16.7%. Because the disease is rare, most positives are false positives."},{"t":"Probability","d":3,"q":"Machine A makes 60% of the items and 2% of them are defective; machine B makes 40% and 5% of those are defective. A randomly chosen item is defective. What is the probability it came from machine A?","o":["3/5","3/8","1/50","5/8"],"a":1,"e":"P(def) = 0.6 × 0.02 + 0.4 × 0.05 = 0.012 + 0.020 = 0.032. P(A | def) = 0.012/0.032 = 3/8."},{"t":"Probability","d":2,"q":"What is the expected value of one roll of a fair die?","o":["7/2","3","4","6"],"a":0,"e":"E = (1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 3.5 = 7/2. It need not be a possible outcome."},{"t":"Probability","d":2,"q":"What is the expected value of the sum of two fair dice?","o":["6","3.5","7","12"],"a":2,"e":"By linearity E(X + Y) = 3.5 + 3.5 = 7."},{"t":"Probability","d":2,"q":"A fair coin is tossed 10 times. What is the expected number of heads?","o":["5","10","2.5","4"],"a":0,"e":"E = n × p = 10 × 1/2 = 5."},{"t":"Probability","d":2,"q":"A game pays $10 with probability 1/5 and costs you $2 otherwise. What is your expected gain per play?","o":["+$0.40","−$0.40","$2","$0"],"a":0,"e":"E = 10 × 1/5 + (−2) × 4/5 = 2 − 1.6 = +0.4 dollars."},{"t":"Probability","d":3,"q":"What is the variance of a single fair die roll?","o":["3.5","7/2","35/12","1/6"],"a":2,"e":"E(X²) = 91/6 and E(X)² = (7/2)² = 49/4, so Var = 91/6 − 49/4 = 35/12 ≈ 2.92."},{"t":"Probability","d":2,"q":"A fair coin is tossed 5 times. What is the probability of exactly 2 heads?","o":["2/5","5/16","1/4","1/32"],"a":1,"e":"C(5,2) × (1/2)⁵ = 10/32 = 5/16."},{"t":"Probability","d":3,"q":"A fair coin is tossed 6 times. What is the probability of exactly 3 heads?","o":["1/2","5/16","3/6","1/8"],"a":1,"e":"C(6,3)/2⁶ = 20/64 = 5/16."},{"t":"Probability","d":3,"q":"A biased coin lands heads with probability 1/3. It is tossed 4 times. What is the probability of exactly 1 head?","o":["8/81","1/81","16/81","32/81"],"a":3,"e":"Binomial: C(4,1) (1/3)(2/3)³ = 4 × 8/81 = 32/81."},{"t":"Probability","d":2,"q":"A fair die is rolled 4 times. What is the probability of at least one six?","o":["4/6","671/1296","1/1296","625/1296"],"a":1,"e":"P(no six in 4 rolls) = (5/6)⁴ = 625/1296. So P(at least one) = 671/1296 ≈ 0.52."},{"t":"Probability","d":2,"q":"What is the probability that the FIRST six on a fair die appears on the 3rd roll?","o":["25/216","1/6","1/216","5/18"],"a":0,"e":"Two non-sixes then a six: (5/6)(5/6)(1/6) = 25/216."},{"t":"Probability","d":2,"q":"Three fair dice are rolled. What is the probability that all three numbers are different?","o":["5/9","1/6","5/6","1/36"],"a":0,"e":"6 × 5 × 4 = 120 favourable of 216 = 5/9."},{"t":"Probability","d":2,"q":"Three fair dice are rolled. What is the probability that the sum is 4?","o":["1/216","1/72","1/36","1/54"],"a":1,"e":"Only 1, 1, 2 in 3 orders: 3/216 = 1/72."},{"t":"Probability","d":1,"q":"How many outcomes are in the sample space when 3 fair dice are rolled?","o":["18","216","36","120"],"a":1,"e":"Each die has 6 outcomes: 6³ = 216."},{"t":"Probability","d":1,"q":"How many outcomes are in the sample space when 4 fair coins are tossed?","o":["8","4","16","24"],"a":2,"e":"2⁴ = 16."},{"t":"Probability","d":2,"q":"A number is chosen at random from 1 to 100. What is the probability that it is prime?","o":["1/4","1/5","3/10","1/10"],"a":0,"e":"There are 25 primes up to 100, so 25/100 = 1/4."},{"t":"Probability","d":2,"q":"A two-digit number (10–99) is chosen at random. What is the probability that it is divisible by 5?","o":["1/10","1/5","1/9","19/90"],"a":1,"e":"Multiples of 5 from 10 to 95: 18. Out of 90 two-digit numbers: 18/90 = 1/5."},{"t":"Probability","d":2,"q":"A number is chosen at random from 1 to 30. What is the probability that it is a multiple of 3 OR of 5?","o":["16/30","7/15","13/30","1/2"],"a":1,"e":"Multiples of 3: 10; multiples of 5: 6; of both (15 and 30): 2. Union = 10 + 6 − 2 = 14, so 14/30 = 7/15."},{"t":"Probability","d":1,"q":"A letter is chosen at random from the word PROBABILITY. What is the probability that it is a vowel?","o":["5/11","3/11","4/11","1/11"],"a":2,"e":"Letters: P R O B A B I L I T Y (11). Vowels O, A, I, I = 4 → 4/11."},{"t":"Probability","d":2,"q":"A family has 3 children. Assuming boys and girls are equally likely, what is the probability of at least one girl?","o":["3/4","7/8","1/2","1/8"],"a":1,"e":"Complement of all boys (1/8): 7/8."},{"t":"Probability","d":3,"q":"Monty Hall: you pick one of three doors; the host, who knows where the car is, opens another door with a goat. If you SWITCH to the remaining door, what is your probability of winning the car?","o":["1/2","1/3","3/4","2/3"],"a":3,"e":"Your first pick is right with probability 1/3. If it is wrong (2/3), the host's choice leaves the car behind the other door, so switching wins with probability 2/3."},{"t":"Probability","d":2,"q":"A fair coin has landed heads 5 times in a row. What is the probability that the next toss is heads?","o":["1/64","1/32","1/2","Less than 1/2"],"a":2,"e":"Tosses are independent; the coin has no memory. Believing tails is 'due' is the gambler's fallacy."},{"t":"Probability","d":1,"q":"Which value can NOT be the probability of an event?","o":["0","0.5","1.3","1"],"a":2,"e":"Probabilities lie between 0 and 1 inclusive."},{"t":"Probability","d":2,"q":"The odds in favour of an event are 3 : 2. What is the probability of the event?","o":["3/2","2/5","3/5","2/3"],"a":2,"e":"Odds a : b in favour mean probability a/(a + b) = 3/5."},{"t":"Probability","d":2,"q":"P(A) = 0.5, P(B) = 0.4 and P(A or B) = 0.7. What is P(A and B)?","o":["0.9","0.3","0.2","0.1"],"a":2,"e":"P(A ∩ B) = P(A) + P(B) − P(A ∪ B) = 0.5 + 0.4 − 0.7 = 0.2."},{"t":"Probability","d":2,"q":"P(A) = 0.6, P(B) = 0.5 and P(A and B) = 0.3. Are A and B independent?","o":["Yes, because 0.6 × 0.5 = 0.3","No, because 0.6 + 0.5 ≠ 0.3","No, because they overlap","Cannot be decided"],"a":0,"e":"Independence means P(A ∩ B) = P(A) P(B). Here 0.6 × 0.5 = 0.3, so they are independent."},{"t":"Probability","d":2,"q":"A committee of 3 is picked at random from 5 men and 4 women. What is the probability that all three are women?","o":["4/9","1/21","1/9","1/12"],"a":1,"e":"C(4,3)/C(9,3) = 4/84 = 1/21."},{"t":"Probability","d":2,"q":"A committee of 3 is picked at random from 5 men and 4 women. What is the probability that it has at least one woman?","o":["5/6 ","1/21","2/3","37/42"],"a":3,"e":"Complement of all men: 1 − C(5,3)/C(9,3) = 1 − 10/84 = 74/84 = 37/42."},{"t":"Probability","d":3,"q":"In a 6/49 lottery you pick 6 numbers. What is the probability of matching all 6 drawn numbers?","o":["1/49","1/13983816","6/49","1/720"],"a":1,"e":"C(49,6) = 13,983,816 equally likely combinations, so the probability is 1/13,983,816."},{"t":"Probability","d":2,"q":"A fair coin is tossed until the first head appears. What is the probability that the first head comes on exactly the 3rd toss?","o":["1/3","1/8","1/2","3/8"],"a":1,"e":"T T H: (1/2)³ = 1/8."},{"t":"Probability","d":3,"q":"A fair die is rolled repeatedly until a six appears. What is the expected number of rolls?","o":["3.5","6","12","1"],"a":1,"e":"The waiting time for an event of probability p has mean 1/p = 6."},{"t":"Probability","d":2,"q":"P(A | B) is NOT the same as P(B | A) in general. Which formula relates them?","o":["P(A | B) = P(B | A)","P(A | B) = P(A) + P(B)","P(A | B) = P(A) P(B)","Bayes' theorem: P(A | B) = P(B | A) P(A) / P(B)"],"a":3,"e":"Bayes' theorem reverses a conditional probability. Confusing the two is the 'prosecutor's fallacy'."},{"t":"Probability","d":2,"q":"The law of total probability says P(B) equals:","o":["P(A) + P(B)","P(B | A) P(A) + P(B | not A) P(not A)","P(B | A) + P(B | not A)","P(A | B) P(B)"],"a":1,"e":"Split B by the two exclusive cases A and not A, then weight each conditional probability by the probability of its case."},{"t":"Probability","d":2,"q":"A fair coin is tossed 3 times. What is the probability of at most one head?","o":["1/8","3/8","1/2","1/4"],"a":2,"e":"0 heads (1 way) + 1 head (3 ways) = 4 of 8 = 1/2."},{"t":"Quick everyday maths","d":1,"q":"What is 20% of 250?","o":["20","25","50","500"],"a":2,"e":"20% = 20/100, so 250 × 0.20 = 50. Shortcut: 10% is 25, so 20% is 50."},{"t":"Quick everyday maths","d":1,"q":"What is 15% of 80?","o":["8","12","15","10"],"a":1,"e":"10% of 80 is 8 and 5% is 4, so 15% is 12."},{"t":"Quick everyday maths","d":1,"q":"A shirt costs 400. After a 25% discount, what is the price?","o":["375","100","300","325"],"a":2,"e":"Discount = 25% of 400 = 100, so the price is 400 − 100 = 300."},{"t":"Quick everyday maths","d":2,"q":"A price is increased by 20% and then decreased by 20%. What is the net change?","o":["No change","4% decrease","4% increase","20% decrease"],"a":1,"e":"Start at 100: +20% → 120; −20% of 120 = −24 → 96. A net 4% fall, because the second percentage is taken of a bigger number."},{"t":"Quick everyday maths","d":1,"q":"40 is what percent of 160?","o":["4%","25%","40%","20%"],"a":1,"e":"40/160 = 1/4 = 25%."},{"t":"Quick everyday maths","d":2,"q":"A population of 5000 grows 10% each year (compounded). What is it after 2 years?","o":["5500","6000","5100","6050"],"a":3,"e":"Year 1: 5000 × 1.1 = 5500. Year 2: 5500 × 1.1 = 6050."},{"t":"Quick everyday maths","d":1,"q":"A student scores 72 out of 90. What is the percentage?","o":["72%","80%","90%","18%"],"a":1,"e":"72/90 = 0.8 = 80%."},{"t":"Quick everyday maths","d":2,"q":"Divide 120 in the ratio 3 : 5. What are the two parts?","o":["40 and 80","45 and 75","60 and 60","30 and 90"],"a":1,"e":"Total parts = 3 + 5 = 8; one part = 120/8 = 15. Shares: 3 × 15 = 45 and 5 × 15 = 75."},{"t":"Quick everyday maths","d":1,"q":"5 pens cost 60. How much do 8 pens cost at the same rate?","o":["96","80","100","120"],"a":0,"e":"One pen = 12, so 8 pens = 96."},{"t":"Quick everyday maths","d":2,"q":"If a : b = 2 : 3 and b : c = 4 : 5, what is a : b : c?","o":["2 : 3 : 5","8 : 12 : 15","8 : 12 : 5","6 : 9 : 10"],"a":1,"e":"Make b equal in both ratios: a : b = 8 : 12 and b : c = 12 : 15. So a : b : c = 8 : 12 : 15."},{"t":"Quick everyday maths","d":1,"q":"What is the average of 4, 8, 15, 17 and 6?","o":["9","10","11","12"],"a":1,"e":"Sum = 50; 50 / 5 = 10."},{"t":"Quick everyday maths","d":2,"q":"The average of 5 numbers is 20. One number, 10, is removed. What is the average of the remaining four?","o":["20","22.5","22","25"],"a":1,"e":"Total = 5 × 20 = 100. After removing 10 the total is 90 over 4 numbers: 22.5."},{"t":"Quick everyday maths","d":3,"q":"A car goes from A to B at 60 km/h and returns at 40 km/h. What is the average speed for the whole trip?","o":["50 km/h","45 km/h","48 km/h","52 km/h"],"a":2,"e":"Equal distances d: total time = d/60 + d/40 = 5d/120, so the average speed = 2d / (5d/120) = 48 km/h. It is the harmonic mean, not 50."},{"t":"Quick everyday maths","d":2,"q":"20 students have an average mark of 70 and 30 students have an average of 80. What is the average of all 50?","o":["75","78","74","76"],"a":3,"e":"Weighted average: (1400 + 2400)/50 = 3800/50 = 76."},{"t":"Quick everyday maths","d":1,"q":"What is the simple interest on 5000 at 8% per year for 3 years?","o":["400","1500","1200","1000"],"a":2,"e":"SI = P r t / 100 = 5000 × 8 × 3 / 100 = 1200."},{"t":"Quick everyday maths","d":2,"q":"What is the compound interest on 1000 at 10% per year for 2 years?","o":["200","210","220","100"],"a":1,"e":"Amount = 1000 × 1.1² = 1210, so the interest is 1210 − 1000 = 210 (simple interest would be 200)."},{"t":"Quick everyday maths","d":1,"q":"An item is bought for 80 and sold for 100. What is the profit percentage?","o":["25%","20%","80%","15%"],"a":0,"e":"Profit = 20 on a cost of 80: 20/80 = 25%. Profit percent is always on the cost price."},{"t":"Quick everyday maths","d":1,"q":"An item with cost price 500 is sold at a 20% loss. What is the selling price?","o":["400","420","480","600"],"a":0,"e":"Loss = 20% of 500 = 100, so SP = 400."},{"t":"Quick everyday maths","d":1,"q":"A car travels at 60 km/h for 2.5 hours. How far does it go?","o":["120 km","24 km","150 km","62.5 km"],"a":2,"e":"Distance = speed × time = 60 × 2.5 = 150 km."},{"t":"Quick everyday maths","d":1,"q":"Convert 72 km/h to m/s.","o":["7.2 m/s","36 m/s","20 m/s","2 m/s"],"a":2,"e":"Multiply km/h by 5/18: 72 × 5/18 = 20 m/s."},{"t":"Quick everyday maths","d":2,"q":"A can do a job in 10 days and B in 15 days. How long will they take together?","o":["6 days","12.5 days","5 days","25 days"],"a":0,"e":"Rates add: 1/10 + 1/15 = 5/30 = 1/6 of the job per day, so 6 days."},{"t":"Quick everyday maths","d":3,"q":"A 120 m long train moving at 54 km/h crosses a pole. How long does it take?","o":["2.2 seconds","12 seconds","8 seconds","6 seconds"],"a":2,"e":"54 km/h = 15 m/s. The train must cover its own length: 120 / 15 = 8 s."},{"t":"Quick everyday maths","d":1,"q":"Solve 3x + 7 = 22.","o":["3","5","7","4"],"a":1,"e":"3x = 22 − 7 = 15, so x = 5."},{"t":"Quick everyday maths","d":1,"q":"What are the roots of x² − 5x + 6 = 0?","o":["−2 and −3","2 and 3","1 and 6","−1 and 6"],"a":1,"e":"Factorise: (x − 2)(x − 3) = 0, since 2 + 3 = 5 and 2 × 3 = 6."},{"t":"Quick everyday maths","d":2,"q":"If x + y = 10 and x − y = 2, what is x × y?","o":["20","16","24","25"],"a":2,"e":"Add the equations: 2x = 12, so x = 6 and y = 4. Product = 24."},{"t":"Quick everyday maths","d":1,"q":"Expand (x + 3)(x − 3).","o":["x² + 9","x² − 9","x² − 6x − 9","x² + 6x + 9"],"a":1,"e":"Difference of squares: (a + b)(a − b) = a² − b² with a = x, b = 3."},{"t":"Quick everyday maths","d":2,"q":"What is 1 + 2 + 3 + ... + 100?","o":["5000","5050","5100","10100"],"a":1,"e":"Formula n(n + 1)/2 = 100 × 101/2 = 5050 (Gauss)."},{"t":"Quick everyday maths","d":2,"q":"What is the sum of the first 10 odd numbers (1 + 3 + 5 + ... + 19)?","o":["90","110","100","55"],"a":2,"e":"The sum of the first n odd numbers is n² = 100."},{"t":"Quick everyday maths","d":1,"q":"What are the HCF and LCM of 12 and 18?","o":["HCF 36, LCM 6","HCF 6, LCM 36","HCF 3, LCM 72","HCF 6, LCM 216"],"a":1,"e":"12 = 2² × 3 and 18 = 2 × 3². HCF = 2 × 3 = 6; LCM = 2² × 3² = 36. Check: HCF × LCM = 216 = 12 × 18."},{"t":"Quick everyday maths","d":3,"q":"What is the remainder when 2¹⁰ is divided by 7?","o":["1","3","2","4"],"a":2,"e":"2³ = 8 ≡ 1 (mod 7), so 2¹⁰ = (2³)³ × 2 ≡ 2. Direct: 1024 = 7 × 146 + 2."},{"t":"Quick everyday maths","d":1,"q":"Is 4725 divisible by 9?","o":["No, it ends in 5","No, its digit sum is 17","Yes, its digit sum 18 is a multiple of 9","Only divisible by 3"],"a":2,"e":"A number is divisible by 9 when its digit sum is: 4 + 7 + 2 + 5 = 18. (4725 = 9 × 525.)"},{"t":"Quick everyday maths","d":2,"q":"How many positive factors does 36 have?","o":["6","8","9","12"],"a":2,"e":"36 = 2² × 3². Number of factors = (2 + 1)(2 + 1) = 9: 1, 2, 3, 4, 6, 9, 12, 18, 36."},{"t":"Quick everyday maths","d":1,"q":"What is the next number in the series 2, 6, 12, 20, 30, ...?","o":["40","36","44","42"],"a":3,"e":"The differences are 4, 6, 8, 10, so the next is +12: 30 + 12 = 42. (The terms are n(n + 1).)"},{"t":"Quick everyday maths","d":1,"q":"What is 3/4 + 2/3?","o":["5/7","17/12","5/12","1 1/6"],"a":1,"e":"Common denominator 12: 9/12 + 8/12 = 17/12."},{"t":"Quick everyday maths","d":2,"q":"What is the last digit of 7⁴?","o":["1","7","9","3"],"a":0,"e":"7¹ = 7, 7² = 49 (9), 7³ = 343 (3), 7⁴ = 2401 (1). The last digits of powers of 7 cycle 7, 9, 3, 1."},{"t":"Quick everyday maths","d":1,"q":"What is 2⁶ ?","o":["12","32","128","64"],"a":3,"e":"2 × 2 × 2 × 2 × 2 × 2 = 64."},{"t":"Quick everyday maths","d":2,"q":"A is 20% more than B. B is what percent less than A?","o":["20%","25%","15%","16 2/3 %"],"a":3,"e":"Let B = 100, A = 120. B is 20 less than A: 20/120 = 1/6 = 16 2/3 %."},{"t":"Quick everyday maths","d":1,"q":"What is 2.5 hours in minutes?","o":["150","250","125","205"],"a":0,"e":"2.5 × 60 = 150 minutes."},{"t":"Vectors","d":1,"q":"What is the magnitude of the vector (3, 4)?","o":["7","12","5","1"],"a":2,"e":"|v| = √(3² + 4²) = √25 = 5."},{"t":"Vectors","d":1,"q":"What is the magnitude of the vector (1, 2, 2)?","o":["5","3","9","√5"],"a":1,"e":"√(1 + 4 + 4) = √9 = 3."},{"t":"Vectors","d":1,"q":"What is the magnitude of 2i − 3j + 6k?","o":["11","7","5","Cannot be found"],"a":1,"e":"√(4 + 9 + 36) = √49 = 7."},{"t":"Vectors","d":1,"q":"Add the vectors (1, 2, 3) and (4, 5, 6).","o":["(3, 3, 3)","32","(4, 10, 18)","(5, 7, 9)"],"a":3,"e":"Add corresponding components: (1 + 4, 2 + 5, 3 + 6)."},{"t":"Vectors","d":1,"q":"What is 3 × (2, −1, 4)?","o":["(5, 2, 7)","(6, -1, 4)","(6, -3, 12)","(6, 3, 12)"],"a":2,"e":"A scalar multiplies every component."},{"t":"Vectors","d":1,"q":"Subtract: (5, 2, 1) − (1, 3, 4).","o":["(6, 5, 5)","(4, 1, 3)","(-4, 1, 3)","(4, -1, -3)"],"a":3,"e":"Component-wise: (5 − 1, 2 − 3, 1 − 4)."},{"t":"Vectors","d":1,"q":"What is the dot product of (1, 2, 3) and (4, 5, 6)?","o":["(4, 10, 18)","15","32","21"],"a":2,"e":"1·4 + 2·5 + 3·6 = 4 + 10 + 18 = 32. The dot product is a scalar."},{"t":"Vectors","d":1,"q":"What is the dot product of (2, −1, 3) and (1, 4, 2)?","o":["8","12","0","4"],"a":3,"e":"2·1 + (−1)·4 + 3·2 = 2 − 4 + 6 = 4."},{"t":"Vectors","d":1,"q":"Are (2, 3) and (3, −2) perpendicular?","o":["Yes, their dot product is 0","No, their dot product is 13","No, they are parallel","Only in 3D"],"a":0,"e":"2·3 + 3·(−2) = 0. Two non-zero vectors are perpendicular exactly when their dot product is zero."},{"t":"Vectors","d":2,"q":"For which value of k is (k, 2, 1) perpendicular to (3, −1, 4)?","o":["2/3","-2/3","−3/2","2"],"a":1,"e":"Dot product = 3k − 2 + 4 = 3k + 2 = 0 → k = −2/3."},{"t":"Vectors","d":2,"q":"What is the angle between (1, 0) and (1, 1)?","o":["30°","60°","90°","45°"],"a":3,"e":"cos θ = (1·1 + 0·1)/(1 × √2) = 1/√2, so θ = 45°."},{"t":"Vectors","d":2,"q":"What is the angle between (1, 2, 2) and (2, 1, −2)?","o":["0°","45°","90°","180°"],"a":2,"e":"Dot product = 2 + 2 − 4 = 0, so they are perpendicular: 90°."},{"t":"Vectors","d":2,"q":"What is the angle between (1, 1, 0) and (0, 1, 1)?","o":["45°","60°","90°","30°"],"a":1,"e":"dot = 1, |a||b| = √2 × √2 = 2, so cos θ = 1/2 and θ = 60°."},{"t":"Vectors","d":2,"q":"What is the unit vector in the direction of (3, 4)?","o":["(3, 4)","(1/3, 1/4)","(3/5, 4/5)","(4/5, 3/5)"],"a":2,"e":"Divide by the magnitude 5: (3/5, 4/5). A unit vector has magnitude 1."},{"t":"Vectors","d":2,"q":"What is the unit vector in the direction of (2, −1, 2)?","o":["(2, −1, 2)","(1/2, −1, 1/2)","(2/3, −1/3, 2/3)","(2/9, −1/9, 2/9)"],"a":2,"e":"|v| = √(4 + 1 + 4) = 3, so the unit vector is (2/3, −1/3, 2/3)."},{"t":"Vectors","d":1,"q":"What is i × j (unit vectors along x and y)?","o":["−k","0","k","1"],"a":2,"e":"By the right-hand rule i × j = k, j × k = i, k × i = j. Reversing the order flips the sign: j × i = −k."},{"t":"Vectors","d":1,"q":"What is a × a for any vector a?","o":["|a|²","a","The zero vector","1"],"a":2,"e":"A vector is parallel to itself, so the cross product is 0. (a · a = |a|² is the DOT product.)"},{"t":"Vectors","d":2,"q":"What is (1, 2, 3) × (4, 5, 6)?","o":["(3, -6, 3)","(-3, 6, -3)","(4, 10, 18)","32"],"a":1,"e":"Using the determinant rule: (2·6 − 3·5, 3·4 − 1·6, 1·5 − 2·4) = (−3, 6, −3). Swapping the order flips every sign."},{"t":"Vectors","d":2,"q":"What is (2, 0, 1) × (1, 1, 0)?","o":["(1, -1, -2)","(-1, 1, 2)","(0, 0, 2)","(2, 0, 0)"],"a":1,"e":"(0·0 − 1·1, 1·1 − 2·0, 2·1 − 0·1) = (−1, 1, 2)."},{"t":"Vectors","d":2,"q":"What is the area of the parallelogram spanned by (1, 0, 0) and (1, 2, 0)?","o":["2","1","3","Cannot be found"],"a":0,"e":"The area is |a × b|. a × b = (0, 0, 2), whose magnitude is 2."},{"t":"Vectors","d":2,"q":"What is the area of the triangle with sides given by the vectors (3, 0, 0) and (0, 4, 0)?","o":["6","12","7","5"],"a":0,"e":"Triangle area = ½ |a × b| = ½ × 12 = 6."},{"t":"Vectors","d":2,"q":"What is the volume of the parallelepiped with edges (1, 0, 0), (0, 2, 0) and (0, 0, 3)?","o":["5","3","6","1"],"a":2,"e":"Volume = |a · (b × c)| = 1 × 2 × 3 = 6 (a box with sides 1, 2, 3)."},{"t":"Vectors","d":3,"q":"Are the vectors (1, 2, 3), (2, 4, 6) and (0, 1, 0) coplanar?","o":["No, the triple product is 6","No, they are perpendicular","Cannot be decided","Yes, the scalar triple product is 0"],"a":3,"e":"(2, 4, 6) = 2 × (1, 2, 3), so the first two are parallel and any third vector lies in a plane with them: the scalar triple product is zero."},{"t":"Vectors","d":1,"q":"What is the distance between the points (1, 2, 3) and (4, 6, 3)?","o":["7","25","3","5"],"a":3,"e":"Difference (3, 4, 0), magnitude √(9 + 16 + 0) = 5."},{"t":"Vectors","d":1,"q":"Find the vector from A(1, 2) to B(4, 6).","o":["(5, 8)","(-3, -4)","(4, 6)","(3, 4)"],"a":3,"e":"AB = B − A = (4 − 1, 6 − 2) = (3, 4). Head minus tail."},{"t":"Vectors","d":1,"q":"What is the midpoint of (2, 4, 6) and (4, 8, 10)?","o":["(3, 6, 8)","(6, 12, 16)","(2, 4, 4)","(1, 2, 2)"],"a":0,"e":"Average the coordinates: ((2 + 4)/2, (4 + 8)/2, (6 + 10)/2)."},{"t":"Vectors","d":2,"q":"What is the scalar projection of a = (3, 4) onto b = (1, 0)?","o":["4","5","1","3"],"a":3,"e":"comp_b a = a·b/|b| = 3/1 = 3 (the x-component of a)."},{"t":"Vectors","d":3,"q":"What is the scalar projection of a = (2, 3, 6) onto b = (1, 2, 2)?","o":["20","20/3","20/9","7"],"a":1,"e":"a·b = 2 + 6 + 12 = 20, |b| = 3, so the projection is 20/3 ≈ 6.67. (20/9 is the factor in the VECTOR projection (a·b/|b|²) b.)"},{"t":"Vectors","d":2,"q":"A force F = (2, 3, 1) N moves an object through d = (4, 1, 2) m. How much work is done?","o":["6","11","13","8"],"a":2,"e":"W = F · d = 8 + 3 + 2 = 13 J."},{"t":"Vectors","d":2,"q":"Are (2, −4, 6) and (−1, 2, −3) parallel?","o":["No, their dot product is not 0","No, they point in the same direction","Yes, they are perpendicular","Yes, one is −2 times the other"],"a":3,"e":"(2, −4, 6) = −2 × (−1, 2, −3). Parallel vectors are scalar multiples; here the scalar is negative, so they point in opposite directions."},{"t":"Vectors","d":2,"q":"For which k is (1, k, 2) parallel to (2, 6, 4)?","o":["2","6","3","12"],"a":2,"e":"(2, 6, 4) = 2 × (1, 3, 2), so k = 3."},{"t":"Vectors","d":1,"q":"Which is TRUE for any vectors a and b?","o":["a × b = b × a","a × b = −(b × a)","a · b is a vector","a × b is a scalar"],"a":1,"e":"The cross product is anti-commutative. The dot product is commutative and gives a scalar."},{"t":"Vectors","d":2,"q":"If |a| = 3, |b| = 4 and a · b = 0, what is |a + b|?","o":["7","1","5","12"],"a":2,"e":"|a + b|² = |a|² + 2a·b + |b|² = 9 + 0 + 16 = 25, so |a + b| = 5 (a right-angled triangle)."},{"t":"Vectors","d":2,"q":"If |a| = 3 and |b| = 4, which value of |a + b| is IMPOSSIBLE?","o":["8","1","5","7"],"a":0,"e":"By the triangle inequality 1 ≤ |a + b| ≤ 7. A value of 8 is outside the range."},{"t":"Vectors","d":3,"q":"What are the direction cosines of the vector (1, 2, 2)?","o":["1, 2, 2","1/5, 2/5, 2/5","1/3, 2/3, 2/3","1/9, 2/9, 2/9"],"a":2,"e":"Divide each component by |v| = 3. The squares sum to 1: 1/9 + 4/9 + 4/9 = 1."},{"t":"Vectors","d":2,"q":"Are (1, 0) and (2, 0) linearly independent?","o":["Yes, because they are different","Yes, because they have the same length","No, one is a multiple of the other","Only in 3D"],"a":2,"e":"Vectors are dependent when one is a scalar multiple of the other: (2, 0) = 2(1, 0)."},{"t":"Vectors","d":2,"q":"Which pair is linearly independent?","o":["(1, 2) and (2, 4)","(1, 0) and (3, 0)","(1, 2) and (2, 3)","(0, 0) and (1, 5)"],"a":2,"e":"Only (1, 2) and (2, 3) are not multiples of each other (their determinant is 1·3 − 2·2 = −1 ≠ 0). The others contain a multiple pair or the zero vector."},{"t":"Vectors","d":1,"q":"What is the dimension of R³, and how many vectors form a basis of it?","o":["3 and 3","2 and 3","3 and 2","1 and 3"],"a":0,"e":"A basis of R³ needs exactly 3 linearly independent vectors, e.g. i, j, k."},{"t":"Vectors","d":3,"q":"Are the points A(1, 1, 1), B(2, 2, 2) and C(4, 4, 4) collinear?
