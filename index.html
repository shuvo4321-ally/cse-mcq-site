rocesses to request resources in a fixed global order prevents deadlock by breaking:","o":["Mutual exclusion","Hold and wait","No preemption","Circular wait"],"a":3,"e":"With a total order, a cycle of waiting processes is impossible because someone would have to request a lower-numbered resource while holding a higher one."},{"t":"Deadlocks","d":3,"q":"Banker's algorithm. Available = (3, 3, 2). Allocation: P0 (0,1,0), P1 (2,0,0), P2 (3,0,2), P3 (2,1,1), P4 (0,0,2). Max: P0 (7,5,3), P1 (3,2,2), P2 (9,0,2), P3 (2,2,2), P4 (4,3,3). Is the state safe? If so, which safe sequence is found by scanning processes in index order repeatedly?","o":["Unsafe","P1, P3, P4, P0, P2","P0, P1, P2, P3, P4","P2, P0, P4, P3, P1"],"a":1,"e":"Need = Max − Allocation: P0 (7,4,3), P1 (1,2,2), P2 (6,0,0), P3 (0,1,1), P4 (4,3,1). Work (3,3,2): P1 fits → work (5,3,2); P3 fits → (7,4,3); P4 fits → (7,4,5); P0 fits → (7,5,5); P2 fits → (10,5,7). Safe: P1, P3, P4, P0, P2."},{"t":"Deadlocks","d":3,"q":"A system has 3 processes, each needing at most 4 units of the same resource type. What is the MINIMUM number of resource units that guarantees the system can never deadlock?","o":["9","10","12","4"],"a":1,"e":"Worst case: each process holds 3 (one short of its maximum): 3 × 3 = 9 units used and all stuck. One extra unit lets one process finish: R = n(m − 1) + 1 = 3 × 3 + 1 = 10."},{"t":"Deadlocks","d":2,"q":"Deadlock AVOIDANCE differs from deadlock PREVENTION in that avoidance:","o":["Negates one of the four conditions permanently","Uses advance information (e.g. maximum needs) to grant requests only if the state stays safe","Ignores deadlocks","Kills processes at random"],"a":1,"e":"Prevention structurally eliminates a condition. Avoidance (Banker's algorithm) checks each request dynamically."},{"t":"Deadlocks","d":2,"q":"In a resource-allocation graph with SINGLE-instance resources, a cycle means:","o":["Possible deadlock only","Deadlock","Safe state","Starvation"],"a":1,"e":"With one instance per resource type, a cycle is necessary and sufficient for deadlock. With multiple instances it is necessary but not sufficient."},{"t":"Deadlocks","d":2,"q":"The \"ostrich algorithm\" in deadlock handling means:","o":["Detect and recover","Ignore the problem and assume deadlocks are rare (used by Unix/Windows)","Prevent all four conditions","Use the Banker's algorithm"],"a":1,"e":"It trades correctness in rare cases for simplicity and performance."},{"t":"Deadlocks","d":2,"q":"Which is a way to RECOVER from a detected deadlock?","o":["Add more RAM","Abort one or more deadlocked processes or preempt resources from them","Increase the time quantum","Defragment the disk"],"a":1,"e":"Recovery options: process termination (all or one at a time) or resource preemption with rollback."},{"t":"Deadlocks","d":2,"q":"Allowing a process to request all its resources at once before it starts (or to release before requesting more) breaks:","o":["Hold and wait","Mutual exclusion","Circular wait","No preemption"],"a":0,"e":"The process never holds some resources while waiting for others. The costs are low utilisation and possible starvation."},{"t":"Deadlocks","d":3,"q":"Which of the following describes a SAFE state?","o":["A state in which deadlock has occurred","A state in which there exists a sequence of processes such that each can obtain its maximum needs and finish","A state with no allocated resources","A state with all processes blocked"],"a":1,"e":"Safe means a safe sequence exists, so deadlock can be avoided. Unsafe states do not guarantee deadlock but make it possible."},{"t":"Deadlocks","d":2,"q":"Which condition is violated if resources can be forcibly taken away from a process?","o":["Mutual exclusion","Hold and wait","No preemption","Circular wait"],"a":2,"e":"Preemption is only practical for resources whose state can be saved and restored (CPU registers, memory), not for printers or locks."},{"t":"Memory management","d":2,"q":"A system has 32-bit logical addresses and a page size of 4 KB. How many bits are used for the page NUMBER and the OFFSET?","o":["20 and 12","12 and 20","16 and 16","22 and 10"],"a":0,"e":"4 KB = 2^12 bytes, so the offset takes 12 bits. The page number takes 32 − 12 = 20 bits (2^20 pages)."},{"t":"Memory management","d":2,"q":"For the system above, if each page-table entry is 4 bytes, the size of a single-level page table per process is:","o":["1 MB","4 MB","16 MB","4 KB"],"a":1,"e":"2^20 entries × 4 bytes = 4 MB per process, which motivates multi-level and inverted page tables."},{"t":"Memory management","d":2,"q":"A computer has 1 GB of physical memory and 4 KB frames. How many frames are there?","o":["2^16","2^18","2^20","2^30"],"a":1,"e":"1 GB = 2^30; frame size 2^12; frames = 2^18 = 262,144."},{"t":"Memory management","d":3,"q":"A process needs 72,766 bytes and the page size is 2048 bytes. How many bytes of INTERNAL fragmentation occur in the last page?","o":["0","962","1086","2048"],"a":1,"e":"Pages needed = ceil(72,766 / 2048) = 36. Allocated = 36 × 2048 = 73,728. Internal fragmentation = 73,728 − 72,766 = 962 bytes."},{"t":"Memory management","d":3,"q":"TLB hit ratio is 80%, TLB lookup takes 20 ns, memory access takes 100 ns. What is the effective memory access time (single-level page table)?","o":["120 ns","140 ns","160 ns","220 ns"],"a":1,"e":"Hit: 20 + 100 = 120 ns. Miss: 20 + 100 (page table) + 100 (data) = 220 ns. EAT = 0.8×120 + 0.2×220 = 96 + 44 = 140 ns."},{"t":"Memory management","d":2,"q":"A 32-bit address space with 4 KB pages and 4-byte entries uses a two-level page table. A typical split of the 32 bits is:","o":["10 + 10 + 12","16 + 16","8 + 8 + 16","12 + 12 + 8"],"a":0,"e":"The 20-bit page number is split into two 10-bit indices (1024 entries × 4 B = 4 KB, exactly one page each). The remaining 12 bits are the offset."},{"t":"Memory management","d":2,"q":"Which problem does EXTERNAL fragmentation describe?","o":["Wasted space inside an allocated block","Free memory is split into many small non-contiguous holes that cannot satisfy a large request","Paging errors","Cache misses"],"a":1,"e":"Contiguous allocation suffers from external fragmentation (solved by paging/compaction). Paging has only internal fragmentation."},{"t":"Memory management","d":3,"q":"Memory partitions (in order): 100 KB, 500 KB, 200 KB, 300 KB, 600 KB. Processes arrive in order: 212 KB, 417 KB, 112 KB, 426 KB. Which strategy places ALL four processes?","o":["First-fit","Best-fit","Worst-fit","None of them"],"a":1,"e":"Best-fit: 212 → 300, 417 → 500, 112 → 200, 426 → 600. First-fit and worst-fit leave the 426 KB process waiting."},{"t":"Memory management","d":2,"q":"In segmentation, a logical address consists of:","o":["A page number and an offset","A segment number and an offset (checked against the segment limit)","A frame number only","A cylinder and a sector"],"a":1,"e":"The segment table gives (base, limit). If offset ≥ limit, a trap (segmentation fault) occurs."},{"t":"Memory management","d":2,"q":"What does the TLB cache?","o":["Recently used data blocks","Recent page-number-to-frame-number translations","Disk sectors","Instructions"],"a":1,"e":"The Translation Lookaside Buffer avoids an extra memory access for the page table on most references."},{"t":"Memory management","d":2,"q":"Compared with paging, segmentation:","o":["Has no external fragmentation","Matches the programmer's view (code, stack, heap) but suffers from external fragmentation","Uses fixed-size units","Has no protection"],"a":1,"e":"Segments have variable lengths, so holes appear. Paging uses fixed-size pages and avoids external fragmentation."},{"t":"Memory management","d":2,"q":"An inverted page table has:","o":["One entry per virtual page of each process","One entry per physical frame","No entries","One entry per file"],"a":1,"e":"It saves memory (size depends on physical memory) but makes lookups slower, so hashing is often used."},{"t":"Memory management","d":2,"q":"Swapping means:","o":["Exchanging two variables","Moving an entire process between main memory and a backing store","Changing the CPU","Rewriting files"],"a":1,"e":"The medium-term scheduler swaps out processes to free memory and swaps them in later."},{"t":"Memory management","d":2,"q":"Base and limit registers provide:","o":["File protection","Address translation and protection for contiguous allocation","TLB entries","Disk scheduling"],"a":1,"e":"Each address is checked to lie in [base, base+limit) and relocated by the base register."},{"t":"Memory management","d":2,"q":"Which allocation strategy tends to leave the LARGEST leftover hole after allocation?","o":["First-fit","Best-fit","Worst-fit","Buddy"],"a":2,"e":"Worst-fit allocates the largest hole, leaving the biggest remainder. Best-fit leaves tiny unusable fragments."},{"t":"Virtual memory","d":3,"q":"Reference string 7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1 with 3 frames. How many page faults occur under FIFO?","o":["9","12","15","18"],"a":2,"e":"Simulating FIFO replacement gives 15 faults. For the same string LRU gives 12 and Optimal gives 9."},{"t":"Virtual memory","d":3,"q":"For the same reference string and 3 frames, how many page faults does LRU produce?","o":["9","12","15","20"],"a":1,"e":"LRU evicts the page unused for the longest time: 12 faults."},{"t":"Virtual memory","d":3,"q":"For the same string and 3 frames, the OPTIMAL (Belady) algorithm produces how many page faults?","o":["6","9","12","15"],"a":1,"e":"Optimal evicts the page whose next use is farthest in the future: 9 faults, the theoretical minimum for this string."},{"t":"Virtual memory","d":3,"q":"Belady's anomaly: with FIFO and the reference string 1 2 3 4 1 2 5 1 2 3 4 5, how many page faults occur with 3 frames and with 4 frames?","o":["9 and 10","10 and 9","9 and 9","8 and 10"],"a":0,"e":"FIFO gives 9 faults with 3 frames but 10 with 4 frames: more frames can yield more faults. LRU and Optimal are stack algorithms and never show the anomaly."},{"t":"Virtual memory","d":3,"q":"Memory access time is 200 ns, the page-fault service time is 8 ms and the page-fault rate is p = 0.001. What is the effective access time?","o":["200 ns","≈ 8,200 ns","≈ 8 ms","≈ 2,000 ns"],"a":1,"e":"EAT = (1 − p) × 200 + p × 8,000,000 = 199.8 + 8000 ≈ 8200 ns. A tiny fault rate slows memory about 40 times."},{"t":"Virtual memory","d":2,"q":"Thrashing occurs when:","o":["The CPU overheats","A process spends more time paging (swapping pages in and out) than executing","The disk is full","Too few processes are running"],"a":1,"e":"When total working sets exceed physical memory, page-fault rate soars and CPU utilisation collapses. The OS should reduce the multiprogramming level."},{"t":"Virtual memory","d":2,"q":"The working-set model is used to:","o":["Schedule disk I/O","Estimate the set of pages a process actively uses and keep it in memory to avoid thrashing","Compress memory","Reorder instructions"],"a":1,"e":"The working set is the set of pages referenced in the last Δ references."},{"t":"Virtual memory","d":2,"q":"In demand paging, a page is brought into memory:","o":["Before the program starts","Only when it is first referenced (page fault)","Randomly","Only by the user"],"a":1,"e":"A reference to an invalid page causes a trap; the OS loads the page from disk, updates the page table and restarts the instruction."},{"t":"Virtual memory","d":2,"q":"What is the purpose of the DIRTY (modify) bit?","o":["Mark corrupted pages","Show that a page was written to, so it must be written back to disk before being replaced","Mark kernel pages","Prevent swapping"],"a":1,"e":"Clean pages can simply be discarded, saving an I/O operation."},{"t":"Virtual memory","d":2,"q":"The \"second-chance\" (clock) page replacement algorithm is an approximation of:","o":["FIFO","LRU","Optimal","MRU"],"a":1,"e":"It cycles through frames; if the reference bit is 1 it clears it and moves on, otherwise it evicts the page."},{"t":"Virtual memory","d":2,"q":"Which of the following is TRUE about the Optimal page replacement algorithm?","o":["It is easy to implement in real systems","It needs future knowledge, so it is used only as a benchmark","It suffers from Belady's anomaly","It is the same as FIFO"],"a":1,"e":"OPT is unrealizable but gives the minimum fault count to compare real algorithms against."},{"t":"Virtual memory","d":2,"q":"What is the effect of a page-fault service when no free frame exists?","o":["The OS just waits","A page replacement algorithm picks a victim page to evict","The program is terminated immediately","The disk is formatted"],"a":1,"e":"If the victim is dirty it is written back first, then the needed page is read into the freed frame."},{"t":"Virtual memory","d":2,"q":"A program's logical address space is larger than physical memory. This is possible because of:","o":["Segmentation fault","Virtual memory with demand paging","Interrupts","Compilation"],"a":1,"e":"Only the needed pages occupy RAM, others stay on disk."},{"t":"File systems & disks","d":2,"q":"Disk head is at cylinder 53 and the request queue is 98, 183, 37, 122, 14, 124, 65, 67. What is the total head movement under FCFS?","o":["236","320","640","208"],"a":2,"e":"FCFS serves in arrival order: |53−98| + |98−183| + |183−37| + |37−122| + |122−14| + |14−124| + |124−65| + |65−67| = 45 + 85 + 146 + 85 + 108 + 110 + 59 + 2 = 640."},{"t":"File systems & disks","d":3,"q":"Same queue and start (53). What is the total head movement under SSTF (shortest seek time first)?","o":["236","208","299","640"],"a":0,"e":"Order: 53 → 65 → 67 → 37 → 14 → 98 → 122 → 124 → 183. Distances: 12 + 2 + 30 + 23 + 84 + 24 + 2 + 59 = 236."},{"t":"File systems & disks","d":3,"q":"Same queue, head at 53 moving toward cylinder 0 first, disk with cylinders 0–199. What is the total head movement under SCAN (elevator)?","o":["208","236","331","382"],"a":1,"e":"SCAN goes down to cylinder 0 (53), then up to the highest request 183 (183), total = 53 + 183 = 236. LOOK would turn around at 14 and cost 39 + 169 = 208."},{"t":"File systems & disks","d":3,"q":"Same queue, head at 53, moving toward 0 first. What is the total head movement under LOOK?","o":["208","236","299","640"],"a":0,"e":"LOOK reverses at the last request in each direction: 53 → 14 (39) then 14 → 183 (169) = 208."},{"t":"File systems & disks","d":2,"q":"Which file-allocation method suffers from external fragmentation but gives the fastest sequential and direct access?","o":["Linked allocation","Contiguous allocation","Indexed allocation","FAT"],"a":1,"e":"Contiguous allocation stores each file in consecutive blocks; files cannot grow easily and holes appear."},{"t":"File systems & disks","d":2,"q":"In linked allocation, the main weakness is:","o":["External fragmentation","Poor random (direct) access because blocks must be followed one by one, and one lost pointer breaks the file","No sequential access","Fixed file size"],"a":1,"e":"FAT keeps the links in a separate table to speed this up."},{"t":"File systems & disks","d":2,"q":"A Unix inode contains:","o":["The file name","File metadata (owner, permissions, size, timestamps) and pointers to data blocks, but not the name","The file content only","The directory path"],"a":1,"e":"File names are stored in directory entries that map the name to an inode number. That is why hard links are possible."},{"t":"File systems & disks","d":2,"q":"In Unix, `chmod 755 file` sets permissions to:","o":["rwxr-xr-x","rw-r--r--","rwxrwxrwx","r-xr-xr-x"],"a":0,"e":"7 = rwx for the owner, 5 = r-x for the group, 5 = r-x for others."},{"t":"File systems & disks","d":2,"q":"Which RAID level uses mirroring (every block duplicated on two disks)?","o":["RAID 0","RAID 1","RAID 5","RAID 6"],"a":1,"e":"RAID 0 stripes (no redundancy), RAID 1 mirrors, RAID 5 uses distributed single parity, RAID 6 dual parity."},{"t":"File systems & disks","d":2,"q":"A hard link and a symbolic link differ because:","o":["A hard link is another directory entry pointing to the same inode; a symbolic link is a separate file that stores a path","They are the same","A symbolic link shares the inode","Hard links can cross file systems"],"a":0,"e":"Deleting the original name leaves a hard link working but breaks a symlink. Hard links cannot cross file systems."},{"t":"File systems & disks","d":2,"q":"Disk access time is the sum of:","o":["Seek time + rotational latency + transfer time","CPU time + I/O time","Boot time + load time","Read time only"],"a":0,"e":"Seek (moving the head), rotational latency (waiting for the sector) and transfer time."}]},{"id":"comp","code":"CSE420","name":"Compiler Design","qs":[{"t":"Compiler phases","d":1,"q":"What is the correct order of the main phases of a compiler?","o":["Lexical → Syntax → Semantic → Intermediate code → Optimisation → Code generation","Syntax → Lexical → Semantic → Code generation → Optimisation","Semantic → Lexical → Syntax → Code generation","Optimisation → Lexical → Syntax → Code generation"],"a":0,"e":"The front end analyses the source (lexical, syntax, semantic analysis), then intermediate code is generated and optimised, and the back end generates target code."},{"t":"Compiler phases","d":1,"q":"Which phase converts a stream of characters into a stream of tokens?","o":["Syntax analysis","Lexical analysis (scanner)","Semantic analysis","Code generation"],"a":1,"e":"The lexer groups characters into lexemes and produces tokens, removing whitespace and comments."},{"t":"Compiler phases","d":2,"q":"In which phase would each of these errors be detected? (1) `int 2x;` (2) `x = 5 + ;` (3) `int a = \"hello\";`","o":["(1) syntax, (2) lexical, (3) semantic","(1) lexical, (2) syntax, (3) semantic","(1) semantic, (2) lexical, (3) syntax","(1) lexical, (2) semantic, (3) syntax"],"a":1,"e":"`2x` is an invalid token (lexical). `5 + ;` violates the grammar (syntax). Assigning a string to an int is a type error (semantic)."},{"t":"Compiler phases","d":2,"q":"The symbol table is used by:","o":["Only the lexical analyser","Many phases: it stores identifier attributes (type, scope, address) that are looked up and updated across phases","Only the code generator","Only the linker"],"a":1,"e":"The lexer inserts names, semantic analysis checks types and scopes, and code generation uses storage addresses."},{"t":"Compiler phases","d":2,"q":"What is the difference between a compiler and an interpreter?","o":["A compiler translates the whole program to target code before execution; an interpreter executes it step by step","There is none","An interpreter produces an executable file","A compiler runs line by line"],"a":0,"e":"Compiled code usually runs faster; interpreters are more flexible for debugging. Many languages (Java, Python) use both: bytecode compilation plus an interpreter or JIT."},{"t":"Compiler phases","d":2,"q":"Which pair correctly names the front end and back end work?","o":["Front end: code generation; back end: lexical analysis","Front end: analysis (lexical, syntax, semantic); back end: synthesis (optimisation, code generation)","Front end: linking; back end: loading","Front end: parsing only; back end: scanning only"],"a":1,"e":"The front end depends on the source language; the back end depends on the target machine. This split lets M languages and N targets need M + N, not M × N, components."},{"t":"Compiler phases","d":2,"q":"A cross compiler is one that:","o":["Compiles only C code","Runs on one machine and generates code for a different target machine","Is written in assembly","Has no optimiser"],"a":1,"e":"For example, building ARM firmware on an x86 laptop."},{"t":"Compiler phases","d":2,"q":"What is a \"pass\" in a compiler?","o":["A password check","One complete traversal of the source program or its intermediate representation","A phase that can be skipped","A kind of error"],"a":1,"e":"Several phases may be combined in a single pass; a two-pass compiler reads the program twice (or reads the IR produced by the first pass)."},{"t":"Compiler phases","d":2,"q":"The tool that combines separately compiled object files and libraries into one executable is the:","o":["Preprocessor","Assembler","Linker","Parser"],"a":2,"e":"The linker resolves external symbols; the loader places the executable into memory."},{"t":"Compiler phases","d":2,"q":"Bootstrapping a compiler means:","o":["Restarting the computer","Writing a compiler for a language in that same language (using a simpler earlier version to compile it)","Removing bugs","Compiling at boot time"],"a":1,"e":"T-diagrams describe how a self-hosting compiler is obtained from a small seed compiler."},{"t":"Lexical analysis","d":1,"q":"What is the difference between a token, a lexeme and a pattern?","o":["They are synonyms","A token is a class (e.g. ID); a lexeme is the actual character sequence (e.g. `count`); a pattern is the rule describing the lexemes","A lexeme is the class; a token is the string","A pattern is the actual string"],"a":1,"e":"For example the lexeme `count` matches the pattern `letter(letter|digit)*` and is reported as token ID."},{"t":"Lexical analysis","d":2,"q":"How many tokens does `int x = a + b * 3;` contain?","o":["6","9","10","12"],"a":1,"e":"Tokens: int, x, =, a, +, b, *, 3, ; = 9 tokens (whitespace is discarded)."},{"t":"Lexical analysis","d":2,"q":"How many tokens does `if (x >= 10) y = y + 1;` contain? (Treat `>=` as a single token.)","o":["10","11","12","14"],"a":2,"e":"if, (, x, >=, 10, ), y, =, y, +, 1, ; = 12."},{"t":"Lexical analysis","d":2,"q":"The lexer rule \"longest match\" means that for the input `>>=` the scanner (if it knows `>`, `>>` and `>>=`) returns:","o":["`>` then `>=`","`>>=` as one token","`>>` then `=`","`>` `>` `=`"],"a":1,"e":"The scanner prefers the longest prefix that matches any token pattern. Ties are broken by rule order (keywords before identifiers)."},{"t":"Lexical analysis","d":2,"q":"Which regular expression describes C-like identifiers?","o":["digit (letter | digit)*","(letter | _) (letter | digit | _)*","letter*","(letter | digit)+"],"a":1,"e":"An identifier must begin with a letter or underscore, followed by any number of letters, digits or underscores."},{"t":"Lexical analysis","d":2,"q":"How many states does the MINIMAL DFA have for the language (a|b)*abb?","o":["3","4","5","11"],"a":1,"e":"States track the longest suffix matching a prefix of `abb`: 0, a, ab, abb, so 4 states. (The Thompson NFA for the same expression has 11 states.)"},{"t":"Lexical analysis","d":2,"q":"What is the worst-case number of DFA states produced by the subset construction from an NFA with n states?","o":["n","n²","2ⁿ","n!"],"a":2,"e":"Each DFA state is a subset of NFA states, so up to 2ⁿ subsets."},{"t":"Lexical analysis","d":2,"q":"How many states does the minimal DFA need to recognise binary strings that are divisible by 3?","o":["2","3","4","6"],"a":1,"e":"States are the remainder modulo 3: 0, 1, 2."},{"t":"Lexical analysis","d":2,"q":"Which tool generates lexical analysers from regular expressions?","o":["Yacc/Bison","Lex/Flex","LLVM","GCC"],"a":1,"e":"Lex/Flex produce scanners; Yacc/Bison produce parsers."},{"t":"Lexical analysis","d":2,"q":"Which of these CANNOT be recognised by a regular expression / finite automaton?","o":["Strings over {a, b} ending in ab","Balanced parentheses of arbitrary depth","Strings with an even number of a's","Identifiers"],"a":1,"e":"Matching arbitrarily nested parentheses needs unbounded memory (a stack), so it requires a context-free grammar."},{"t":"Lexical analysis","d":2,"q":"Input buffering with a sentinel (eof character at the end of each buffer half) is used to:","o":["Compress input","Reduce the number of end-of-buffer checks per character","Detect syntax errors","Store identifiers"],"a":1,"e":"The sentinel lets the scanner check for end of buffer only when it actually sees that special character."},{"t":"Lexical analysis","d":2,"q":"Which strings are matched by the regular expression `a(b|c)*d`?","o":["ad, abd, acbd","bd, cd","a, abc","abcd only"],"a":0,"e":"The string must start with a, end with d, with any mix of b and c in between (including nothing)."},{"t":"Context-free grammars","d":2,"q":"Consider E → E + E | E * E | id. The string id + id * id is:","o":["Unambiguous","Ambiguous: it has two distinct parse trees","Not derivable","Derivable in exactly one way"],"a":1,"e":"It can be parsed as (id + id) * id or as id + (id * id). Ambiguity is resolved by rewriting the grammar with precedence levels or by parser disambiguation rules."},{"t":"Context-free grammars","d":2,"q":"Eliminate the immediate left recursion in A → A α | β.","o":["A → β A', A' → α A' | ε","A → α A | β","A → A' α, A' → β | ε","A → β α"],"a":0,"e":"The β must come first, followed by repeated α: A → βA', A' → αA' | ε. Left recursion makes top-down parsers loop forever."},{"t":"Context-free grammars","d":2,"q":"The grammar S → a S b | ε generates:","o":["aⁿ bᵐ","aⁿ bⁿ, n ≥ 0","(ab)ⁿ","Any string over {a, b}"],"a":1,"e":"Each application adds an a on the left and a matching b on the right. This language is context-free but not regular."},{"t":"Context-free grammars","d":2,"q":"Which derivation order do LL parsers trace and which do LR parsers trace (in reverse)?","o":["LL: rightmost; LR: leftmost","LL: leftmost; LR: rightmost (in reverse)","Both leftmost","Both rightmost"],"a":1,"e":"LL = Left-to-right scan, Leftmost derivation. LR = Left-to-right scan, Rightmost derivation in reverse."},{"t":"Context-free grammars","d":3,"q":"Apply left factoring to A → a b c | a b d | e.","o":["A → a b A' | e, A' → c | d","A → a A' | e, A' → b c | b d","A → a b c | e","A → A' c | A' d | e"],"a":0,"e":"Pull out the longest common prefix a b: A → abA' | e and A' → c | d. This removes the need for lookahead beyond one token."},{"t":"Context-free grammars","d":2,"q":"A grammar is ambiguous if:","o":["It has more than one production for some non-terminal","Some string has more than one leftmost derivation (or parse tree)","It has left recursion","It has epsilon productions"],"a":1,"e":"More than one production per non-terminal is normal. Ambiguity means multiple parse trees for the same string."},{"t":"Context-free grammars","d":2,"q":"Which grammar class is recognised by a pushdown automaton?","o":["Regular","Context-free","Context-sensitive","Unrestricted"],"a":1,"e":"CFLs ⟷ PDAs. Regular languages ⟷ finite automata; context-sensitive ⟷ linear bounded automata; unrestricted ⟷ Turing machines."},{"t":"Context-free grammars","d":2,"q":"The parse tree for the expression `2 + 3 * 4` using the standard grammar E → E + T | T, T → T * F | F, F → num shows the multiplication:","o":["At the root","Deeper in the tree than +, so it is evaluated first","Above the +","Only on the right edge"],"a":1,"e":"Operators with higher precedence appear lower in the parse tree. Structuring the grammar in levels enforces precedence."},{"t":"Context-free grammars","d":2,"q":"What is the language generated by S → S S | ( S ) | ε?","o":["Strings of the form (ⁿ )ⁿ only","All balanced parentheses","All strings of ( and )","Empty string only"],"a":1,"e":"It generates every well-nested sequence of parentheses (the Dyck language). It is ambiguous because S S can group in several ways."},{"t":"Context-free grammars","d":2,"q":"Why must left recursion be removed for recursive-descent parsing?","o":["It uses too much memory","The parser would call the same procedure again without consuming input, causing infinite recursion","It makes the grammar ambiguous","It is not allowed in BNF"],"a":1,"e":"For A → A α, the procedure for A immediately calls A again at the same input position."},{"t":"Top-down parsing","d":2,"q":"For the grammar E → T E', E' → + T E' | ε, T → F T', T' → * F T' | ε, F → ( E ) | id, what is FIRST(E)?","o":["{ +, ε }","{ (, id }","{ ), $ }","{ *, +, ), $ }"],"a":1,"e":"E derives T E' and T derives F T', so FIRST(E) = FIRST(T) = FIRST(F) = { (, id }."},{"t":"Top-down parsing","d":2,"q":"For the same grammar, what is FIRST(E')?","o":["{ +, ε }","{ (, id }","{ *, ε }","{ + }"],"a":0,"e":"E' → + T E' | ε, so FIRST(E') = { +, ε }."},{"t":"Top-down parsing","d":2,"q":"For the same grammar, what is FOLLOW(E)?","o":["{ $ }","{ ), $ }","{ +, ), $ }","{ *, +, ), $ }"],"a":1,"e":"E is the start symbol ($ is in its follow set) and appears inside parentheses in F → ( E ), so ) is also in FOLLOW(E)."},{"t":"Top-down parsing","d":3,"q":"For the same grammar, what is FOLLOW(T)?","o":["{ ), $ }","{ +, ), $ }","{ *, +, ), $ }","{ +, * }"],"a":1,"e":"T appears in E → T E' (followed by E', whose FIRST is + and which can be ε, so FOLLOW(E) = { ), $ } joins) and in E' → + T E' (same). So FOLLOW(T) = { +, ), $ }."},{"t":"Top-down parsing","d":3,"q":"For the same grammar, what is FOLLOW(F)?","o":["{ +, ), $ }","{ *, +, ), $ }","{ *, ) }","{ (, id }"],"a":1,"e":"F appears in T → F T' and T' → * F T'. FOLLOW(F) includes FIRST(T') minus ε = { * }, and since T' can be ε, FOLLOW(T) = { +, ), $ }. Together: { *, +, ), $ }."},{"t":"Top-down parsing","d":3,"q":"In the LL(1) table for the grammar above, in which cell is the production E' → ε placed?","o":["M[E', +] only","M[E', )] and M[E', $]","M[E', id]","M[E', (]"],"a":1,"e":"For A → ε, place the production under every terminal in FOLLOW(A). FOLLOW(E') = { ), $ }."},{"t":"Top-down parsing","d":2,"q":"Which statement is TRUE for an LL(1) grammar?","o":["It can be ambiguous","It cannot be left-recursive or ambiguous","It can have left recursion","Each non-terminal has at most one production"],"a":1,"e":"LL(1) grammars are unambiguous and not left-recursive, and their parsing table has no multiply defined entries."},{"t":"Top-down parsing","d":3,"q":"For S → A B, A → a | ε, B → b | ε, what is FIRST(S)?","o":["{ a, b }","{ a, b, ε }","{ a }","{ b, ε }"],"a":1,"e":"FIRST(A) = { a, ε } so we continue to B: FIRST(B) = { b, ε }. Both can vanish, so ε ∈ FIRST(S) and FIRST(S) = { a, b, ε }."},{"t":"Top-down parsing","d":3,"q":"For the same grammar S → A B, A → a | ε, B → b | ε, what is FOLLOW(A)?","o":["{ b }","{ b, $ }","{ a, b, $ }","{ $ }"],"a":1,"e":"A is followed by B: FIRST(B) \\ {ε} = { b }. Since B can be ε, FOLLOW(S) = { $ } is added: { b, $ }."},{"t":"Top-down parsing","d":3,"q":"The dangling-else grammar S → i E t S S' | a, S' → e S | ε, E → b is NOT LL(1) because:","o":["It is left recursive","M[S', e] contains two productions: S' → e S and S' → ε","FIRST(S) is empty","It has no start symbol"],"a":1,"e":"In S → i E t S S', the first S is followed by S', so FIRST(S') contains e, hence e ∈ FOLLOW(S); and since S' is at the end of that production, FOLLOW(S') ⊇ FOLLOW(S), so e ∈ FOLLOW(S'). The production S' → ε goes into M[S', e] (FOLLOW rule) and S' → e S also goes into M[S', e] (FIRST rule): a conflict. This is the dangling-else ambiguity."},{"t":"Top-down parsing","d":2,"q":"Recursive descent parsing is:","o":["A bottom-up technique","A top-down technique where each non-terminal has a procedure","Used only for regular languages","Table driven only"],"a":1,"e":"Each non-terminal becomes a function; the lookahead token chooses which production to follow."},{"t":"Top-down parsing","d":2,"q":"A predictive parser uses which data structure to store grammar symbols while parsing?","o":["Queue","Stack","Heap","Hash table only"],"a":1,"e":"The stack holds the symbols still to be matched; the table M[A, a] decides which production replaces A."},{"t":"Top-down parsing","d":2,"q":"In an LL(1) parser, \"1\" denotes:","o":["1 production per rule","One token of lookahead","One pass over the grammar","One stack symbol"],"a":1,"e":"The parser decides which production to use by looking at one input symbol ahead."},{"t":"Top-down parsing","d":3,"q":"Is the grammar S → a S a | a LL(1)?","o":["Yes","No, because both productions begin with a (their FIRST sets overlap)","Yes, because it is not left recursive","No, because it is ambiguous"],"a":1,"e":"FIRST(aSa) = { a } = FIRST(a), so M[S, a] has two entries. Left factoring would not fully fix this since choosing requires looking beyond one symbol."},{"t":"Top-down parsing","d":2,"q":"Panic-mode error recovery in a parser:","o":["Stops compilation at the first error","Discards input tokens until a synchronising token (e.g. `;` or `}`) is found, then resumes","Inserts random tokens","Corrects semantics"],"a":1,"e":"It is simple and cannot loop forever, but may skip real errors."},{"t":"Bottom-up parsing","d":2,"q":"Which parsers belong to the bottom-up (shift-reduce) family?","o":["LL(1) and recursive descent","LR(0), SLR, LALR and canonical LR","Only operator precedence","Only packrat"],"a":1,"e":"All LR parsers build the parse tree from the leaves up using a stack, shifting tokens and reducing handles."},{"t":"Bottom-up parsing","d":1,"q":"What is a \"handle\" in shift-reduce parsing?","o":["A pointer to the stack","A substring matching the right side of a production whose reduction represents one step of a rightmost derivation in reverse","The start symbol","An error token"],"a":1,"e":"Finding and reducing the handle at each step yields the parse. The stack contents together with the remaining input form a right-sentential form."},{"t":"Bottom-up parsing","d":3,"q":"For E → E + T | T, T → T * F | F, F → id, how many REDUCE actions are needed to parse `id + id`?","o":["3","5","6","9"],"a":2,"e":"Reductions: F→id, T→F, E→T (first id), F→id, T→F (second id), E→E+T = 6 reductions, plus 3 shifts (id, +, id). The number of reductions equals the length of the rightmost derivation: E ⇒ E+T ⇒ E+F ⇒ E+id ⇒ T+id ⇒ F+id ⇒ id+id (6 steps)."},{"t":"Bottom-up parsing","d":2,"q":"Which statement about the power of LR parser families is correct?","o":["LR(0) ⊃ SLR ⊃ LALR ⊃ LR(1)","LR(0) ⊂ SLR(1) ⊂ LALR(1) ⊂ LR(1)","SLR is more powerful than LR(1)","All are equal"],"a":1,"e":"The more lookahead information used to resolve reductions, the larger the class of grammars handled. Yacc/Bison implement LALR(1)."},{"t":"Bottom-up parsing","d":2,"q":"A shift/reduce conflict means that in some parser state:","o":["The parser could either shift the next token or reduce by a production","There are two reductions possible","The input is empty","The stack is empty"],"a":0,"e":"The classic case is the dangling else. A reduce/reduce conflict means two different productions could be used to reduce."},{"t":"Bottom-up parsing","d":2,"q":"What does the parser do when it finds the item [A → α·] in the current state (and lookahead permits)?","o":["Shift","Reduce by A → α","Accept","Report an error always"],"a":1,"e":"A dot at the end means the whole right side has been seen: pop |α| symbols and push A (then take the goto)."},{"t":"Bottom-up parsing","d":2,"q":"How many LR(0) items does the production A → X Y Z yield?","o":["3","4","5","6"],"a":1,"e":"One item per dot position: A → ·XYZ, A → X·YZ, A → XY·Z, A → XYZ· = 4 items. (A production A → ε yields just A → ·.)"},{"t":"Bottom-up parsing","d":2,"q":"Which one has MORE states: canonical LR(1) or LALR(1) for the same grammar?","o":["LALR(1)","Canonical LR(1)","They are always equal","Cannot compare"],"a":1,"e":"LALR merges LR(1) states with identical cores, giving the same number of states as SLR/LR(0) but with lookahead sets; canonical LR(1) can have many more."},{"t":"Bottom-up parsing","d":2,"q":"Why is SLR(1) weaker than LALR(1)?","o":["It uses no lookahead","It uses FOLLOW sets as lookaheads for reductions, which are less precise than LALR's state-specific lookaheads","It cannot parse expressions","It is slower"],"a":1,"e":"FOLLOW(A) may contain symbols that cannot actually follow A in a particular state, causing spurious conflicts."},{"t":"Bottom-up parsing","d":2,"q":"Operator-precedence parsing is suited to:","o":["Any context-free grammar","Grammars where no production right side has two adjacent non-terminals or ε","Regular languages only","Type checking"],"a":1,"e":"It uses precedence relations between terminals (<·, ≐, ·>) and is simple but restricted."},{"t":"Bottom-up parsing","d":2,"q":"Which tool generates LALR(1) parsers?","o":["Lex","Yacc / Bison","ANTLR (LL(*))","Make"],"a":1,"e":"Yacc (Yet Another Compiler Compiler) and its GNU successor Bison."},{"t":"Bottom-up parsing","d":3,"q":"At the start of a shift-reduce parse of `id * id` the stack is $ and the input is `id * id $`. After 3 steps (shift id, reduce F→id, reduce T→F) the stack is:","o":["$ T","$ id","$ F","$ T *"],"a":0,"e":"Shift pushes id; reduce F → id replaces it with F; reduce T → F replaces F with T. The stack is $ T and the next action will be to shift *."},{"t":"Bottom-up parsing","d":2,"q":"Which of the following is TRUE about bottom-up parsers compared with top-down?","o":["They handle a larger class of grammars, including left-recursive ones","They cannot handle left recursion","They are always hand-written","They need no stack"],"a":0,"e":"LR parsers accept left-recursive grammars and are the standard choice for programming languages."},{"t":"Bottom-up parsing","d":2,"q":"In LR parsing, the ACTION table is indexed by:","o":["Non-terminal and state","State and terminal (lookahead)","Production and state","Stack depth"],"a":1,"e":"ACTION[state, terminal] gives shift, reduce, accept or error; GOTO[state, non-terminal] gives the next state after a reduction."},{"t":"Bottom-up parsing","d":3,"q":"A grammar is LR(1) but not LALR(1) when:","o":["It is ambiguous","Merging LR(1) states with the same core introduces a reduce/reduce conflict","It has no epsilon","It is regular"],"a":1,"e":"Merging cannot create shift/reduce conflicts that were absent, but it can create reduce/reduce ones."},{"t":"Syntax-directed translation","d":2,"q":"How many temporaries and instructions does three-address code for `a = b * c + d * e` need (one operator per instruction)?","o":["2 temporaries, 3 instructions","3 temporaries, 4 instructions","1 temporary, 2 instructions","4 temporaries, 4 instructions"],"a":1,"e":"t1 = b * c; t2 = d * e; t3 = t1 + t2; a = t3 (a copy). Optimisation can remove the last copy by writing `a = t1 + t2`."},{"t":"Syntax-directed translation","d":2,"q":"What is the postfix form of `a + b * c - d`?","o":["a b + c * d -","a b c * + d -","a b c d * + -","- + a * b c d"],"a":1,"e":"b*c first: b c *; then a + that: a b c * +; then subtract d: a b c * + d -."},{"t":"Syntax-directed translation","d":2,"q":"In the representation of three-address code, a QUADRUPLE has how many fields?","o":["2","3","4","5"],"a":2,"e":"Quadruple = (operator, argument 1, argument 2, result). A triple omits the result field and refers to results by instruction number."},{"t":"Syntax-directed translation","d":3,"q":"Number of nodes in the DAG for the expression a + a * (b - c) + (b - c) * d (common sub-expressions shared)?","o":["7","8","9","12"],"a":2,"e":"Leaves a, b, c, d (4) + nodes for (b−c), a*(b−c), a+a*(b−c), (b−c)*d, and the final + (5) = 9. Without sharing, b−c would appear twice (11 nodes)."},{"t":"Syntax-directed translation","d":2,"q":"Synthesised attributes are computed from:","o":["Parent and siblings","The attributes of the children","Global variables only","The input buffer"],"a":1,"e":"A synthesised attribute at a node depends on its children, so it flows bottom-up. Inherited attributes depend on the parent or left siblings."},{"t":"Syntax-directed translation","d":2,"q":"An S-attributed definition uses:","o":["Only inherited attributes","Only synthesised attributes, so it can be evaluated during bottom-up (LR) parsing","No attributes","Both with no restriction"],"a":1,"e":"L-attributed definitions allow inherited attributes that depend only on parents and left siblings, suitable for top-down parsing."},{"t":"Syntax-directed translation","d":2,"q":"Backpatching is used to:","o":["Fix syntax errors","Fill in jump target addresses that are not known when the jump instruction is generated","Optimise loops","Allocate registers"],"a":1,"e":"Lists of incomplete jumps (truelist/falselist) are patched once the target label is known."},{"t":"Syntax-directed translation","d":2,"q":"What does a translation scheme with semantic actions embedded in productions allow?","o":["Only type checking","Specifying exactly when actions execute during parsing","Removing the parser","Runtime dispatch"],"a":1,"e":"Placement of the action within the right-hand side determines the order of evaluation."},{"t":"Syntax-directed translation","d":2,"q":"Which intermediate representation is closest to the source structure and keeps hierarchical information?","o":["Machine code","Abstract syntax tree (AST)","Assembly","Bytecode"],"a":1,"e":"The AST omits grammar details but keeps the structure; three-address code is linear and closer to the machine."},{"t":"Syntax-directed translation","d":2,"q":"What is the 3-address code for `if (a < b) goto L1`?","o":["if a < b goto L1","goto a b","a < b = L1","load a"],"a":0,"e":"Conditional jumps are written with a relational test and a target label."},{"t":"Syntax-directed translation","d":3,"q":"Which tree(s) can be evaluated left-to-right in a single pass for an L-attributed grammar during LL parsing?","o":["Only synthesised attributes","Attributes whose dependencies point only to the parent and left siblings","Any attribute","None"],"a":1,"e":"This restriction ensures that values are available when needed in a single left-to-right traversal."},{"t":"Semantic analysis & symbol table","d":2,"q":"Static (lexical) scoping vs dynamic scoping: with x = 10 global, f() prints x, and g() { local x = 20; f(); }, what does g() print?","o":["Static: 10; dynamic: 20","Static: 20; dynamic: 10","Both 10","Both 20"],"a":0,"e":"Under static scoping f looks up x in its defining environment (global 10). Under dynamic scoping it uses the caller's binding (20). Most languages use static scoping."},{"t":"Semantic analysis & symbol table","d":2,"q":"Which data structure is most commonly used for a symbol table because of fast lookup?","o":["Linked list","Hash table","Stack only","Queue"],"a":1,"e":"Hash tables give O(1) average insert/lookup; scopes are handled with a stack of tables or chained tables."},{"t":"Semantic analysis & symbol table","d":2,"q":"Type coercion (implicit conversion) occurs when:","o":["The programmer writes a cast","The compiler automatically converts an operand, e.g. int to float in `3 + 2.5`","A syntax error is found","The linker runs"],"a":1,"e":"A cast is an explicit conversion; coercion is inserted by the compiler."},{"t":"Semantic analysis & symbol table","d":2,"q":"Which is an example of a SEMANTIC error?","o":["Missing semicolon","Using an undeclared variable","Unknown character `@`","Unbalanced parenthesis"],"a":1,"e":"Undeclared identifiers, type mismatches and wrong numbers of arguments are semantic errors; missing punctuation is syntactic."},{"t":"Semantic analysis & symbol table","d":2,"q":"Type equivalence: two types are STRUCTURALLY equivalent if:","o":["They have the same name","They have the same structure (same components)","They are in the same file","They occupy 4 bytes"],"a":1,"e":"Name equivalence requires the same type name; structural equivalence compares composition."},{"t":"Semantic analysis & symbol table","d":2,"q":"Parameter passing: after `swap(a, b)` written as `void swap(int x, int y){int t=x;x=y;y=t;}` using CALL BY VALUE with a=1, b=2, the values of a and b are:","o":["2 and 1","1 and 2","1 and 1","2 and 2"],"a":1,"e":"Call by value passes copies, so the callee changes only its own copies. With call by reference (or pointers) the swap would be visible to the caller."},{"t":"Code optimisation","d":2,"q":"Replacing the expression `x = 3 * 4` by `x = 12` at compile time is called:","o":["Dead-code elimination","Constant folding","Strength reduction","Loop unrolling"],"a":1,"e":"Constant folding evaluates constant expressions at compile time."},{"t":"Code optimisation","d":2,"q":"Replacing `y = x * 2` with `y = x << 1` is an example of:","o":["Constant propagation","Strength reduction","Common subexpression elimination","Inlining"],"a":1,"e":"Strength reduction substitutes a cheaper operation for an expensive one (multiplication by shift/add)."},{"t":"Code optimisation","d":2,"q":"Common subexpression elimination (CSE) would transform `a = b + c; d = b + c;` into:","o":["a = b + c; d = a;  (if b and c are unchanged)","a = d;","a = b + c; d = c + b;","Nothing"],"a":0,"e":"The second computation is redundant when neither operand changed in between, so reuse the first result."},{"t":"Code optimisation","d":2,"q":"Which optimisation removes code whose result is never used?","o":["Loop-invariant code motion","Dead-code elimination","Constant folding","Peephole"],"a":1,"e":"Dead code is computation that cannot affect the program output, for example an assignment to a variable never read afterwards."},{"t":"Code optimisation","d":2,"q":"Loop-invariant code motion:","o":["Moves computation that gives the same result every iteration out of the loop","Unrolls the loop","Removes the loop","Adds a new loop"],"a":0,"e":"For example `for(i..) a[i] = x * y` can compute x*y once before the loop if x and y do not change in the loop."},{"t":"Code optimisation","d":3,"q":"Three-address code:\n1: i = 0\n2: if i >= 10 goto 7\n3: t = i * 2\n4: a = t + 1\n5: i = i + 1\n6: goto 2\n7: halt\nHow many BASIC BLOCKS does it have?","o":["2","3","4","5"],"a":2,"e":"Leaders: instruction 1 (first), 2 (target of goto at 6), 3 (follows a conditional jump), 7 (target of the conditional jump and follows a goto). Blocks: {1}, {2}, {3–6}, {7} = 4."},{"t":"Code optimisation","d":2,"q":"Which is a LOCAL optimisation technique operating on a small window of instructions?","o":["Global register allocation","Peephole optimisation","Interprocedural analysis","Loop fusion"],"a":1,"e":"Peephole optimisation examines a few adjacent instructions and replaces them by shorter or faster ones (e.g. removing a store followed by a load of the same value)."},{"t":"Code optimisation","d":2,"q":"Live variable analysis is a:","o":["Forward data-flow analysis","Backward data-flow analysis","Syntax check","Lexical check"],"a":1,"e":"A variable is live at a point if its value may be used later; information flows backward from uses. Reaching definitions is a forward analysis."},{"t":"Code optimisation","d":2,"q":"Register allocation can be modelled as:","o":["Shortest path","Graph colouring on the interference graph","Binary search","Hashing"],"a":1,"e":"Variables that are live at the same time interfere; with k registers we need a k-colouring (NP-complete in general, so heuristics are used)."},{"t":"Code optimisation","d":2,"q":"Which optimisation replaces a function call by the body of the function?","o":["Inlining","Unrolling","Strength reduction","Coalescing"],"a":0,"e":"It removes call overhead and enables further optimisation, at the cost of code size."},{"t":"Code optimisation","d":2,"q":"In the DAG-based local optimisation of a basic block, repeated expressions are detected by:","o":["Reusing existing nodes with the same operator and operands","Counting lines","Reading the symbol table","Hash of the file name"],"a":0,"e":"Before creating a node, check whether a node with the same operator and children already exists."},{"t":"Runtime environments","d":2,"q":"Which memory area stores activation records (local variables, return addresses) of function calls?","o":["Heap","Stack","Static/data area","Code area"],"a":1,"e":"Each call pushes an activation record onto the stack and pops it on return, which supports recursion."},{"t":"Runtime environments","d":2,"q":"Dynamic memory allocated with malloc/new lives in the:","o":["Stack","Heap","Register file","Symbol table"],"a":1,"e":"The heap is managed by the runtime (malloc/free or garbage collection) and persists until explicitly released or collected."},{"t":"Runtime environments","d":2,"q":"What does a static link (access link) in an activation record help with?","o":["Locating non-local variables in nested procedures (lexical scoping)","Returning from the function","Garbage collection","Linking object files"],"a":0,"e":"It points to the activation record of the lexically enclosing procedure."},{"t":"Runtime environments","d":2,"q":"Instruction selection in the code generator maps:","o":["Tokens to the AST","Intermediate code operations to target machine instructions","Source code to tokens","Types to names"],"a":1,"e":"The code generator also performs register allocation and instruction ordering."},{"t":"Runtime environments","d":2,"q":"A garbage collector based on reference counting fails to reclaim:","o":["Objects with count 0","Cyclic structures whose objects reference each other","Local variables","Constants"],"a":1,"e":"Objects in a cycle keep each other's counts above zero even if unreachable from the program; tracing collectors (mark-and-sweep) handle cycles."}]},{"id":"arch","code":"CSE340 / CSE260","name":"Computer Architecture & Digital Logic","qs":[{"t":"Number systems & codes","d":1,"q":"What is the decimal value of the binary number 1011011?","o":["81","91","93","101"],"a":1,"e":"64 + 16 + 8 + 2 + 1 = 91."},{"t":"Number systems & codes","d":1,"q":"What is the hexadecimal representation of decimal 255?","o":["EF","FE","FF","100"],"a":2,"e":"255 = 15 × 16 + 15 = 0xFF."},{"t":"Number systems & codes","d":2,"q":"What is the decimal value of the octal number 745?","o":["485","493","501","3745"],"a":0,"e":"7×64 + 4×8 + 5 = 448 + 32 + 5 = 485."},{"t":"Number systems & codes","d":2,"q":"What is the 8-bit two's complement representation of −45?","o":["10101101","11010011","11010010","01010011"],"a":1,"e":"+45 = 00101101. Invert: 11010010. Add 1: 11010011."},{"t":"Number systems & codes","d":1,"q":"What is the range of an 8-bit two's complement integer?","o":["0 to 255","−127 to 127","−128 to 127","−256 to 255"],"a":2,"e":"n-bit two's complement covers −2^(n−1) to 2^(n−1) − 1, so −128 to +127 for 8 bits."},{"t":"Number systems & codes","d":2,"q":"Adding 01110010 and 01010110 in 8-bit two's complement (114 + 86) gives:","o":["A correct result 200","Overflow: the sum 11001000 is read as −56","Underflow","Carry only"],"a":1,"e":"Two positive numbers produced a negative result, so signed overflow occurred. Overflow is detected when the carry into the MSB differs from the carry out of it."},{"t":"Number systems & codes","d":2,"q":"What is the BCD (8421) code of decimal 59?","o":["0101 1001","111011","0101 0101","1001 0101"],"a":0,"e":"Each decimal digit is coded separately in 4 bits: 5 = 0101, 9 = 1001."},{"t":"Number systems & codes","d":2,"q":"What is the Gray code equivalent of binary 1011?","o":["1110","1010","1101","1000"],"a":0,"e":"Gray = B XOR (B >> 1) = 1011 XOR 0101 = 1110. Adjacent Gray codes differ in exactly one bit."},{"t":"Number systems & codes","d":3,"q":"What is the IEEE 754 single-precision hexadecimal representation of 5.75?","o":["0x40B80000","0x40A00000","0xC0B80000","0x41B80000"],"a":0,"e":"5.75 = 101.11₂ = 1.0111 × 2². Sign 0; exponent = 2 + 127 = 129 = 10000001; mantissa = 0111 followed by zeros. Bits: 0 10000001 0111000... = 0x40B80000."},{"t":"Number systems & codes","d":3,"q":"What is the IEEE 754 single-precision hexadecimal representation of −0.375?","o":["0xBEC00000","0x3EC00000","0xBF400000","0xBE400000"],"a":0,"e":"0.375 = 0.011₂ = 1.1 × 2⁻². Sign 1; exponent = −2 + 127 = 125 = 01111101; mantissa 1000... → 1 01111101 1000... = 0xBEC00000."},{"t":"Number systems & codes","d":2,"q":"How many bits are needed to represent 1000 distinct values?","o":["9","10","11","100"],"a":1,"e":"2^10 = 1024 ≥ 1000 (2^9 = 512 is not enough)."},{"t":"Number systems & codes","d":2,"q":"In IEEE 754 single precision, the numbers of bits for sign, exponent and fraction are:","o":["1, 8, 23","1, 11, 52","1, 5, 10","8, 1, 23"],"a":0,"e":"Single precision: 1 + 8 + 23 = 32 bits with bias 127. Double precision: 1 + 11 + 52 = 64 bits with bias 1023."},{"t":"Number systems & codes","d":3,"q":"In IEEE 754, an exponent field of all 1s with a fraction of all 0s represents:","o":["Zero","NaN","Infinity","The largest normal number"],"a":2,"e":"Exponent all 1s and fraction 0 = ±∞; exponent all 1s and fraction non-zero = NaN; exponent all 0s are zero/denormals."},{"t":"Boolean algebra & K-maps","d":1,"q":"According to De Morgan's theorem, (A + B)' equals:","o":["A' + B'","A' · B'","A · B","(A · B)'"],"a":1,"e":"The complement of a sum is the product of the complements: (A + B)' = A'B'. Likewise (AB)' = A' + B'."},{"t":"Boolean algebra & K-maps","d":2,"q":"Simplify  A + A'B.","o":["A","A + B","AB","B"],"a":1,"e":"A + A'B = (A + A')(A + B) = A + B (the absorption/consensus identity)."},{"t":"Boolean algebra & K-maps","d":2,"q":"Simplify  AB + AB'.","o":["A","B","A + B","1"],"a":0,"e":"AB + AB' = A(B + B') = A · 1 = A."},{"t":"Boolean algebra & K-maps","d":2,"q":"Simplify  (A + B)(A + C).","o":["A + BC","AB + AC","A(B + C)","ABC"],"a":0,"e":"Distributive law: (A + B)(A + C) = A + BC."},{"t":"Boolean algebra & K-maps","d":2,"q":"How many different Boolean functions exist for 2 input variables?","o":["4","8","16","256"],"a":2,"e":"A truth table has 2² = 4 rows, each output can be 0 or 1: 2⁴ = 16 functions. In general 2^(2^n)."},{"t":"Boolean algebra & K-maps","d":2,"q":"The function f(A, B, C) = Σm(1, 3, 5, 7) simplifies to:","o":["A","B","C","A + B"],"a":2,"e":"Minterms 1, 3, 5, 7 are exactly the rows where C = 1 (binary xx1), so f = C."},{"t":"Boolean algebra & K-maps","d":3,"q":"f(A, B, C, D) = Σm(0, 1, 2, 3, 4, 5, 6, 7). The minimal SOP expression is:","o":["A'","A","A'B'","D'"],"a":0,"e":"Minterms 0–7 all have A = 0 (the top half of the truth table), so f = A'."},{"t":"Boolean algebra & K-maps","d":2,"q":"The XOR of three inputs A ⊕ B ⊕ C is 1 for how many input combinations?","o":["2","3","4","6"],"a":2,"e":"It outputs 1 when an odd number of inputs are 1: 001, 010, 100, 111 = 4 combinations (a parity function)."},{"t":"Boolean algebra & K-maps","d":2,"q":"Which gate is called a universal gate?","o":["AND","OR","NAND","XOR"],"a":2,"e":"NAND (and NOR) can build any Boolean function. A NOT gate is a NAND with its inputs tied together."},{"t":"Boolean algebra & K-maps","d":2,"q":"How many 2-input NAND gates are needed to build a 2-input AND gate?","o":["1","2","3","4"],"a":1,"e":"AND = NAND followed by an inverter (itself a NAND with tied inputs): 2 gates."},{"t":"Boolean algebra & K-maps","d":2,"q":"The dual of the Boolean expression A + B·1 is:","o":["A · (B + 0)","A' · B'","A + B","A · B · 0"],"a":0,"e":"Duality swaps AND with OR and 0 with 1: A + (B·1) → A · (B + 0)."},{"t":"Boolean algebra & K-maps","d":2,"q":"In a K-map, a group of 8 adjacent 1s in a 4-variable map eliminates how many variables?","o":["1","2","3","4"],"a":2,"e":"A group of 2^k cells eliminates k variables: 8 = 2³ removes 3 variables, leaving one literal."},{"t":"Boolean algebra & K-maps","d":3,"q":"Which expression is the Product-of-Sums (POS) form?","o":["AB + CD","(A + B)(C + D)","A ⊕ B","A + B + C"],"a":1,"e":"POS is an AND of OR terms (maxterms). SOP is an OR of AND terms (minterms)."},{"t":"Combinational circuits","d":1,"q":"A half adder has the following outputs for inputs A and B:","o":["Sum = A·B, Carry = A ⊕ B","Sum = A ⊕ B, Carry = A·B","Sum = A + B, Carry = A ⊕ B","Sum = A·B, Carry = A + B"],"a":1,"e":"Sum is XOR (1 when exactly one input is 1); carry is AND (both inputs 1)."},{"t":"Combinational circuits","d":2,"q":"For a full adder with inputs A, B and Cin, the carry-out is:","o":["A ⊕ B ⊕ Cin","AB + Cin(A ⊕ B)","A + B + Cin","AB ⊕ Cin"],"a":1,"e":"Cout = AB + (A ⊕ B)Cin, i.e. the majority function. Sum = A ⊕ B ⊕ Cin."},{"t":"Combinational circuits","d":2,"q":"A 4-bit ripple-carry adder adds 1011 + 0110. What are the 4-bit sum and the carry-out?","o":["0001, carry 1","0101, carry 0","1111, carry 0","0001, carry 0"],"a":0,"e":"11 + 6 = 17 = 10001₂: the sum bits are 0001 and the carry-out is 1."},{"t":"Combinational circuits","d":2,"q":"How many select lines does an 8-to-1 multiplexer need?","o":["2","3","4","8"],"a":1,"e":"2^n inputs need n select lines: 8 = 2³."},{"t":"Combinational circuits","d":2,"q":"How many 2-to-1 multiplexers are needed to build an 8-to-1 multiplexer?","o":["3","4","7","8"],"a":2,"e":"4 + 2 + 1 = 7 (a tree)."},{"t":"Combinational circuits","d":2,"q":"A 3-to-8 decoder has:","o":["8 inputs and 3 outputs","3 inputs and 8 outputs (one active at a time)","3 inputs and 3 outputs","8 inputs and 8 outputs"],"a":1,"e":"Each input combination activates exactly one output line (a minterm generator). A full adder can be built from a 3-to-8 decoder and two OR gates."},{"t":"Combinational circuits","d":2,"q":"How many 3-to-8 decoders (with enable) are needed to build a 5-to-32 decoder?","o":["2","3","4","5"],"a":2,"e":"32 outputs need 32 / 8 = 4 decoders of 3-to-8. The two extra (high-order) address bits go to a 2-to-4 decoder whose outputs drive the enable inputs of the four 3-to-8 decoders."},{"t":"Combinational circuits","d":2,"q":"A priority encoder differs from a simple encoder because:","o":["It has more outputs","It gives a valid output even when several inputs are active, choosing the highest priority one","It uses flip-flops","It decodes addresses"],"a":1,"e":"A simple encoder assumes only one input is active."},{"t":"Combinational circuits","d":2,"q":"What is the worst-case delay of an n-bit ripple-carry adder, in terms of n?","o":["Constant","Proportional to n (carry ripples through every stage)","Proportional to log n","Proportional to n²"],"a":1,"e":"A carry may need to propagate from the least to the most significant stage. Carry-lookahead adders reduce this to O(log n)."},{"t":"Combinational circuits","d":2,"q":"A static-1 hazard in a combinational circuit is:","o":["A permanent fault","A momentary 0 glitch while the output should stay 1","A stuck-at-1 fault","An overflow"],"a":1,"e":"Unequal path delays can produce a brief glitch. It can be removed by adding consensus (redundant) terms."},{"t":"Combinational circuits","d":2,"q":"A tri-state buffer has which three output states?","o":["0, 1, X","0, 1, high impedance (Z)","Low, medium, high","0, 1, 2"],"a":1,"e":"High impedance disconnects the output from the bus, allowing several devices to share a bus."},{"t":"Combinational circuits","d":2,"q":"A 4-bit magnitude comparator has how many output lines in the usual design?","o":["1","2","3","4"],"a":2,"e":"A > B, A = B, A < B."},{"t":"Sequential circuits","d":1,"q":"The forbidden input condition of an SR latch built from NOR gates is:","o":["S = 0, R = 0","S = 1, R = 1","S = 1, R = 0","S = 0, R = 1"],"a":1,"e":"With S = R = 1 both outputs go to 0 (Q = Q' = 0), and releasing both simultaneously leaves an unpredictable state."},{"t":"Sequential circuits","d":1,"q":"For a D flip-flop, the next state Q(t+1) equals:","o":["Q(t)","D","Q'(t)","D'"],"a":1,"e":"A D flip-flop copies D to Q at the active clock edge."},{"t":"Sequential circuits","d":2,"q":"A JK flip-flop with J = K = 1 will:","o":["Hold its state","Toggle on each clock edge","Reset","Set"],"a":1,"e":"Characteristic equation Q+ = JQ' + K'Q: J = K = 1 gives Q+ = Q'. J = K = 0 holds; J = 1, K = 0 sets; J = 0, K = 1 resets."},{"t":"Sequential circuits","d":2,"q":"How is a T flip-flop constructed from a JK flip-flop?","o":["J = K = T","J = T, K = T'","J = 0, K = T","J = K = 0"],"a":0,"e":"Tying J and K together to T gives toggle behaviour when T = 1 and hold when T = 0."},{"t":"Sequential circuits","d":2,"q":"The \"race-around\" condition occurs in a level-triggered JK flip-flop when:","o":["J = K = 0","J = K = 1 and the clock pulse width is longer than the propagation delay","The clock is edge-triggered","S = R = 1"],"a":1,"e":"The output keeps toggling during the clock-high interval. Master-slave and edge-triggered designs prevent it."},{"t":"Sequential circuits","d":2,"q":"What is the minimum number of flip-flops needed for a MOD-10 (decade) counter?","o":["3","4","5","10"],"a":1,"e":"2^4 = 16 ≥ 10 states (2^3 = 8 is not enough). A decade counter counts 0 to 9 and resets."},{"t":"Sequential circuits","d":2,"q":"A MOD-60 counter (for seconds in a clock) needs at least how many flip-flops?","o":["5","6","7","60"],"a":1,"e":"2^6 = 64 ≥ 60."},{"t":"Sequential circuits","d":2,"q":"A 3-bit synchronous up counter starts at 000. What is its value after 13 clock pulses?","o":["101","110","011","111"],"a":0,"e":"13 mod 8 = 5 = 101₂."},{"t":"Sequential circuits","d":2,"q":"An n-bit Johnson (twisted-ring) counter has how many distinct states?","o":["n","2n","2ⁿ","n²"],"a":1,"e":"The inverted output of the last flip-flop is fed back to the first, giving 2n states (e.g. 8 states for 4 flip-flops). A ring counter has n states."},{"t":"Sequential circuits","d":2,"q":"A ripple (asynchronous) counter differs from a synchronous counter because:","o":["Flip-flops share the same clock","Each flip-flop is clocked by the output of the previous one, so delays accumulate","It uses no flip-flops","It is faster"],"a":1,"e":"Ripple counters are simple but slower and can show glitches at high speed."},{"t":"Sequential circuits","d":2,"q":"A ripple counter of 3 flip-flops is driven by an 80 MHz clock. What is the frequency at the MSB output?","o":["40 MHz","20 MHz","10 MHz","8 MHz"],"a":2,"e":"Each stage divides the frequency by 2: 80 / 2³ = 10 MHz."},{"t":"Sequential circuits","d":3,"q":"In a sequential circuit, clk-to-Q delay = 2 ns, combinational logic delay = 5 ns and setup time = 1 ns. What is the maximum clock frequency?","o":["100 MHz","125 MHz","200 MHz","500 MHz"],"a":1,"e":"Minimum period = 2 + 5 + 1 = 8 ns, so f = 1/8 ns = 125 MHz."},{"t":"Sequential circuits","d":2,"q":"Which statement distinguishes a Mealy machine from a Moore machine?","o":["Mealy outputs depend only on the state","Mealy outputs depend on both the current state and the current input; Moore outputs depend only on the state","Moore uses no flip-flops","They are identical"],"a":1,"e":"Mealy machines usually need fewer states but their outputs can change asynchronously with inputs."},{"t":"Sequential circuits","d":2,"q":"A finite-state machine has 5 states. The minimum number of flip-flops required to encode them is:","o":["2","3","4","5"],"a":1,"e":"⌈log2 5⌉ = 3 (binary encoding). One-hot encoding would need 5."},{"t":"Sequential circuits","d":2,"q":"A 4-bit serial-in shift register (shifts right) initially holds 0000. The serial input sequence 1, 0, 1, 1 is applied over four clock pulses (first bit first). What does the register hold?","o":["1011","1101","0110","1111"],"a":1,"e":"Each clock shifts bits right and inserts the new bit at the left. After four clocks the first bit is at the right end: reading left to right gives the last-in first: 1, 1, 0, 1."},{"t":"Sequential circuits","d":2,"q":"Setup time of a flip-flop is:","o":["Time after the clock edge that data must remain stable","Time before the clock edge that data must be stable","Clock period","Propagation delay"],"a":1,"e":"Hold time is the time after the clock edge for which data must stay stable. Violating either causes metastability."},{"t":"Sequential circuits","d":2,"q":"Which is the fastest memory technology in the list?","o":["DRAM","SRAM","Flash","Hard disk"],"a":1,"e":"SRAM uses flip-flop cells (6 transistors) and needs no refresh, so it is fast but expensive. DRAM uses a capacitor and needs refresh."},{"t":"Sequential circuits","d":2,"q":"A memory chip of 4K × 8 has how many address lines and data lines?","o":["12 and 8","8 and 12","4 and 8","13 and 8"],"a":0,"e":"4K = 2^12 words → 12 address lines; 8-bit words → 8 data lines."},{"t":"Sequential circuits","d":3,"q":"How many 2K × 8 chips are needed to build a 16K × 16 memory?","o":["8","12","16","32"],"a":2,"e":"Words: 16K/2K = 8 chips deep. Width: 16/8 = 2 chips wide. Total = 8 × 2 = 16 chips."},{"t":"Instruction set architecture","d":2,"q":"Which statement correctly contrasts RISC and CISC?","o":["RISC has complex variable-length instructions and many addressing modes","RISC uses simple fixed-length instructions with a load/store architecture and many registers; CISC has complex multi-cycle instructions","CISC is always faster","RISC cannot be pipelined"],"a":1,"e":"RISC (MIPS, ARM, RISC-V) simplifies decoding and pipelining. CISC (x86) has rich instructions and variable length."},{"t":"Instruction set architecture","d":1,"q":"In a MIPS R-type instruction (32 bits), the fields are: opcode (6), rs (5), rt (5), rd (5), shamt (5), funct (6). How many general-purpose registers can be addressed?","o":["16","32","64","5"],"a":1,"e":"5 bits address 2^5 = 32 registers."},{"t":"Instruction set architecture","d":2,"q":"A processor uses a 7-bit opcode field. How many distinct operations can it encode?","o":["7","49","64","128"],"a":3,"e":"2^7 = 128."},{"t":"Instruction set architecture","d":2,"q":"Which addressing mode places the operand directly in the instruction?","o":["Direct","Immediate","Register indirect","Indexed"],"a":1,"e":"In immediate mode the operand value is part of the instruction (e.g. `ADDI $t0, $t1, 5`)."},{"t":"Instruction set architecture","d":2,"q":"In register indirect addressing, the effective address is:","o":["The register contents","The register number","The instruction field","PC + offset"],"a":0,"e":"The register holds the memory address of the operand: EA = (R). In direct mode the instruction holds the address; in indirect mode, memory holds the address."},{"t":"Instruction set architecture","d":3,"q":"In MIPS, a `beq` branch instruction at address 1000 has an offset field of 5 (counted in words, relative to PC+4). What is the branch target address?","o":["1005","1020","1024","1004"],"a":2,"e":"MIPS branch offsets are relative to the address of the NEXT instruction (PC + 4 = 1004) and counted in words: target = 1004 + 4 × 5 = 1024. Using PC = 1000 directly (1020) is the classic mistake."},{"t":"Instruction set architecture","d":2,"q":"On a LITTLE-endian machine, the 32-bit word 0x12345678 stored at address 100 has which byte at address 100?","o":["0x12","0x34","0x56","0x78"],"a":3,"e":"Little-endian stores the least significant byte at the lowest address: 78 56 34 12 at addresses 100–103. Big-endian stores 12 34 56 78."},{"t":"Instruction set architecture","d":2,"q":"The basic instruction cycle consists of:","o":["Fetch, decode, execute (plus memory access and write-back)","Compile, link, load","Read, write, erase","Boot, run, halt"],"a":0,"e":"The CPU fetches the instruction at the PC, decodes it, executes, accesses memory if needed and writes the result back."},{"t":"Instruction set architecture","d":2,"q":"In a load/store architecture, arithmetic instructions operate on:","o":["Memory operands directly","Registers only; memory is accessed only by load and store","Immediate values only","The stack only"],"a":1,"e":"This keeps instruction formats and pipelining simple."},{"t":"Instruction set architecture","d":2,"q":"Which control unit design uses a ROM storing sequences of micro-operations?","o":["Hardwired control","Microprogrammed control","Pipelined control","DMA control"],"a":1,"e":"Microprogrammed control is flexible and easier to modify; hardwired control is faster."},{"t":"CPU performance","d":2,"q":"A program executes 2 × 10⁹ instructions with an average CPI of 1.5 on a 3 GHz processor. What is the CPU time?","o":["0.5 s","1 s","2 s","9 s"],"a":1,"e":"Time = IC × CPI / clock rate = 2×10⁹ × 1.5 / 3×10⁹ = 1 s."},{"t":"CPU performance","d":2,"q":"Instruction mix: ALU 50% (1 cycle), load/store 30% (2 cycles), branches 20% (3 cycles). What is the average CPI?","o":["1.5","1.7","2.0","2.2"],"a":1,"e":"0.5×1 + 0.3×2 + 0.2×3 = 0.5 + 0.6 + 0.6 = 1.7."},{"t":"CPU performance","d":2,"q":"A 500 MHz processor has an average CPI of 2. What is its MIPS rating?","o":["250","500","1000","2"],"a":0,"e":"MIPS = clock rate / (CPI × 10⁶) = 500×10⁶ / (2×10⁶) = 250."},{"t":"CPU performance","d":2,"q":"Amdahl's law: 40% of a program is sped up by a factor of 4. What is the overall speedup?","o":["1.33","1.43","2.5","4"],"a":1,"e":"Speedup = 1 / ((1 − 0.4) + 0.4/4) = 1 / 0.7 ≈ 1.43."},{"t":"CPU performance","d":2,"q":"If 20% of a program is inherently serial, the maximum speedup with unlimited processors (Amdahl) is:","o":["2","4","5","20"],"a":2,"e":"Max speedup = 1 / 0.2 = 5."},{"t":"CPU performance","d":3,"q":"Dynamic power is P = C V² f. If the supply voltage is reduced by 20% and the frequency is kept the same, the dynamic power becomes:","o":["80%","64%","40%","20%"],"a":1,"e":"(0.8)² = 0.64 of the original power."},{"t":"CPU performance","d":2,"q":"Machine A runs a program in 10 s and machine B in 15 s. How much faster is A than B?","o":["1.2×","1.5×","5×","0.67×"],"a":1,"e":"Speedup = time_B / time_A = 15 / 10 = 1.5."},{"t":"CPU performance","d":2,"q":"Which of the following does NOT affect CPU execution time directly?","o":["Instruction count","CPI","Clock cycle time","Monitor resolution"],"a":3,"e":"CPU time = instruction count × CPI × clock cycle time."},{"t":"CPU performance","d":2,"q":"Which is a limitation of using MIPS as a performance metric?","o":["It cannot be computed","It ignores instruction complexity and differs between ISAs, so it is not comparable across machines","It measures disk speed","It is always larger for CISC"],"a":1,"e":"A machine with simpler instructions may show a higher MIPS rating yet take longer for the same program."},{"t":"Pipelining","d":1,"q":"The five stages of the classic MIPS pipeline are:","o":["Fetch, Decode, Execute, Memory, Write-back","Read, Write, Execute, Send, Stop","Fetch, Compile, Link, Load, Run","Decode, Fetch, Memory, Execute, Store"],"a":0,"e":"IF, ID, EX, MEM, WB."},{"t":"Pipelining","d":2,"q":"How many clock cycles does a 5-stage pipeline need to execute 10 instructions, assuming no stalls?","o":["10","14","15","50"],"a":1,"e":"k + n − 1 = 5 + 10 − 1 = 14 cycles."},{"t":"Pipelining","d":2,"q":"The speedup of a 5-stage pipeline over a non-pipelined machine for 100 instructions (no stalls) is about:","o":["2.5","4.81","5","4"],"a":1,"e":"Non-pipelined: 5 × 100 = 500 cycles. Pipelined: 5 + 100 − 1 = 104. Speedup = 500/104 ≈ 4.81, approaching 5 as n grows."},{"t":"Pipelining","d":3,"q":"Stage delays are IF 200 ps, ID 150 ps, EX 200 ps, MEM 250 ps, WB 100 ps. What is the ideal speedup of the pipelined design over the single-cycle (non-pipelined) design?","o":["3.6","4.5","5","2.5"],"a":0,"e":"Non-pipelined cycle = sum = 900 ps. Pipelined cycle = slowest stage = 250 ps. Speedup = 900 / 250 = 3.6."},{"t":"Pipelining","d":2,"q":"Which type of hazard is a RAW (read-after-write) dependency?","o":["Structural","Data","Control","Memory"],"a":1,"e":"An instruction needs a value that an earlier instruction has not yet written. Forwarding (bypassing) resolves most such cases."},{"t":"Pipelining","d":3,"q":"Even with full forwarding, which sequence still requires one stall in the classic MIPS pipeline?","o":["add $1,$2,$3 followed by sub $4,$1,$5","lw $1,0($2) followed by add $3,$1,$4","sw $1,0($2) followed by lw $3,0($2)","beq followed by add"],"a":1,"e":"A load's data is available only at the end of MEM, but the next instruction needs it at the start of EX. This is the load-use hazard: one stall is needed."},{"t":"Pipelining","d":2,"q":"A structural hazard occurs when:","o":["Two instructions need the same hardware resource in the same cycle","A branch is taken","An operand is not ready","The cache misses"],"a":0,"e":"For example, a single memory port shared by instruction fetch and data access. Separate instruction and data caches avoid it."},{"t":"Pipelining","d":3,"q":"20% of instructions are branches, each causing a 3-cycle penalty (no prediction). What is the effective CPI if the ideal CPI is 1?","o":["1.2","1.6","2.0","3.2"],"a":1,"e":"CPI = 1 + 0.2 × 3 = 1.6."},{"t":"Pipelining","d":2,"q":"A 2-bit saturating-counter branch predictor is better than a 1-bit predictor mainly because:","o":["It uses less hardware","It does not flip its prediction after a single misprediction, which helps with loop branches","It never mispredicts","It predicts all branches as taken"],"a":1,"e":"A loop exit branch would mispredict twice per loop with a 1-bit predictor (exit and next entry); the 2-bit scheme mispredicts only once."},{"t":"Pipelining","d":2,"q":"Which hazards are possible only in out-of-order execution (not in the simple in-order 5-stage pipeline)?","o":["RAW","WAR and WAW","Structural","Control"],"a":1,"e":"In-order pipelines write registers in program order, so name dependences (WAR, WAW) cannot occur unless instructions are reordered. Register renaming removes them."},{"t":"Pipelining","d":2,"q":"A superscalar processor:","o":["Executes one instruction per cycle at most","Issues multiple instructions per clock cycle using multiple execution units","Has no pipeline","Uses only one register"],"a":1,"e":"It can reach CPI < 1."},{"t":"Cache memory","d":2,"q":"A direct-mapped cache has 64 lines and a block size of 16 bytes. For 32-bit addresses, how many bits are in the tag?","o":["20","22","24","26"],"a":1,"e":"Offset = log2 16 = 4 bits; index = log2 64 = 6 bits; tag = 32 − 4 − 6 = 22 bits."},{"t":"Cache memory","d":3,"q":"A 32 KB, 4-way set-associative cache has 64-byte blocks and 32-bit addresses. How many index bits are used?","o":["5","6","7","8"],"a":2,"e":"Blocks = 32768/64 = 512; sets = 512/4 = 128 = 2⁷ → 7 index bits (offset 6, tag 19)."},{"t":"Cache memory","d":2,"q":"Hit time = 1 cycle, miss rate = 5%, miss penalty = 100 cycles. What is the average memory access time (AMAT)?","o":["5 cycles","6 cycles","1 cycle","105 cycles"],"a":1,"e":"AMAT = hit time + miss rate × miss penalty = 1 + 0.05 × 100 = 6 cycles."},{"t":"Cache memory","d":3,"q":"Two-level cache: L1 hit time 1 cycle with 10% miss rate; L2 hit time 10 cycles with 20% local miss rate; main memory 100 cycles. What is the AMAT?","o":["3 cycles","4 cycles","6 cycles","11 cycles"],"a":1,"e":"AMAT = 1 + 0.10 × (10 + 0.20 × 100) = 1 + 0.10 × 30 = 4 cycles."},{"t":"Cache memory","d":2,"q":"In a direct-mapped cache with 8 lines, memory block 25 maps to which line?","o":["0","1","3","25"],"a":1,"e":"Line = block number mod number of lines = 25 mod 8 = 1."},{"t":"Cache memory","d":3,"q":"A direct-mapped cache with 4 lines receives block accesses 0, 4, 8, 0, 4. How many misses occur?","o":["3","4","5","2"],"a":2,"e":"Blocks 0, 4 and 8 all map to line 0 (mod 4), so each access evicts the previous block: all 5 accesses miss (conflict misses)."},{"t":"Cache memory","d":3,"q":"The same access sequence 0, 4, 8, 0, 4 on a 2-way set-associative cache with 4 lines (2 sets, LRU) causes how many misses?","o":["2","3","4","5"],"a":3,"e":"Sets = 2, so blocks 0, 4, 8 all map to set 0 (even numbers) with only 2 ways. LRU gives: 0 miss, 4 miss, 8 miss (evicts 0), 0 miss (evicts 4), 4 miss (evicts 8) = 5 misses."},{"t":"Cache memory","d":2,"q":"The three classes of cache misses are:","o":["Compulsory, capacity, conflict","Read, write, fetch","Hit, miss, stall","Soft, hard, firm"],"a":0,"e":"Compulsory (first access), capacity (working set too large), conflict (too many blocks map to one set)."},{"t":"Cache memory","d":2,"q":"In a write-back cache, a modified block is written to memory:","o":["On every write","Only when the block is replaced (using a dirty bit)","Never","On every read"],"a":1,"e":"Write-through writes memory on every store (simple, more traffic); write-back reduces memory traffic."},{"t":"Cache memory","d":2,"q":"Spatial locality is exploited in caches by:","o":["Using larger blocks (fetching neighbouring words)","Keeping recently used items","Using write-through","Increasing associativity"],"a":0,"e":"Temporal locality is exploited by keeping recently accessed data in the cache; spatial locality by fetching whole blocks."},{"t":"Cache memory","d":2,"q":"Which mapping needs NO replacement policy?","o":["Fully associative","Set-associative","Direct-mapped","All need one"],"a":2,"e":"Each memory block can go to exactly one line in a direct-mapped cache, so there is no choice of victim."},{"t":"Cache memory","d":2,"q":"Which statement about increasing cache associativity is TRUE?","o":["It always increases the hit time and cost, but usually reduces conflict misses","It increases conflict misses","It removes compulsory misses","It has no effect"],"a":0,"e":"Higher associativity needs more comparators and a longer lookup, while reducing conflict misses."},{"t":"I/O & memory systems","d":2,"q":"What is the advantage of DMA over programmed I/O?","o":["The CPU copies every word","Data moves between device and memory without the CPU handling each word, freeing the CPU","No bus is used","It is cheaper"],"a":1,"e":"The CPU only starts the transfer and receives an interrupt on completion."},{"t":"I/O & memory systems","d":2,"q":"Interrupt-driven I/O differs from polling because:","o":["The CPU repeatedly checks the device status","The device signals the CPU when it needs service, so the CPU can do other work","It needs no handlers","It is slower"],"a":1,"e":"Polling wastes CPU cycles but is simple and predictable."},{"t":"I/O & memory systems","d":1,"q":"A CPU with a 32-bit address bus can directly address how much memory (byte-addressable)?","o":["1 GB","2 GB","4 GB","8 GB"],"a":2,"e":"2^32 bytes = 4 GB."},{"t":"I/O & memory systems","d":2,"q":"In memory-mapped I/O:","o":["Devices have a separate address space and special instructions","Device registers share the memory address space and are accessed with ordinary load/store","No devices exist","Only DMA is used"],"a":1,"e":"Isolated (port-mapped) I/O uses special IN/OUT instructions, as on x86."},{"t":"I/O & memory systems","d":2,"q":"Memory interleaving improves performance by:","o":["Making memory larger","Spreading consecutive addresses across multiple banks so they can be accessed in parallel","Using cache","Compressing data"],"a":1,"e":"With 4-way interleaving, four consecutive words can be fetched from four banks simultaneously."},{"t":"I/O & memory systems","d":2,"q":"Which memory is NON-volatile and can be erased and rewritten electrically in blocks?","o":["SRAM","DRAM","Flash","Register file"],"a":2,"e":"Flash retains data without power. SRAM and DRAM lose their contents when power is removed."},{"t":"I/O & memory systems","d":2,"q":"DRAM needs periodic refresh because:","o":["It uses flip-flops","Each bit is stored as charge on a capacitor that leaks","It is non-volatile","It is too fast"],"a":1,"e":"SRAM needs no refresh but costs more per bit."},{"t":"Computer arithmetic","d":2,"q":"Signed overflow in two's complement addition is detected by:","o":["Carry out of the MSB only","Carry into the MSB XOR carry out of the MSB","Sum = 0","Both operands being zero"],"a":1,"e":"Equivalent rule: two operands of the same sign produce a result of the opposite sign."},{"t":"Computer arithmetic","d":2,"q":"Multiplying two n-bit unsigned integers requires a product of up to how many bits?","o":["n","n + 1","2n","n²"],"a":2,"e":"(2ⁿ − 1)² < 2^(2n), so 2n bits are needed."},{"t":"Computer arithmetic","d":2,"q":"Booth's algorithm is mainly used to:","o":["Divide numbers","Multiply signed two's complement numbers efficiently by handling runs of 1s","Add floating-point numbers","Detect errors"],"a":1,"e":"It recodes strings of 1s in the multiplier as a subtraction and an addition (e.g. 0111 = 1000 − 0001), reducing the number of additions."},{"t":"Computer arithmetic","d":2,"q":"In floating-point addition, which step comes FIRST?","o":["Normalise the result","Align the exponents by shifting the mantissa of the smaller number","Round the result","Multiply the mantissas"],"a":1,"e":"Steps: compare/align exponents, add mantissas, normalise, then round."},{"t":"Computer arithmetic","d":3,"q":"Why is 0.1 + 0.2 ≠ 0.3 exactly in IEEE 754?","o":["Hardware bug","Decimal fractions like 0.1 are not exactly representable in binary floating point, so rounding errors accumulate","Floating point uses decimal","Addition is not defined"],"a":1,"e":"0.1 = 0.0001100110011...₂ repeats forever and is round
